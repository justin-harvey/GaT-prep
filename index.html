<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain Blasters! Comic Puzzle Missions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#111; --paper:#fff; --yellow:#FFD93D; --red:#E63946; --blue:#2F80ED;
  --green:#2BB673; --purple:#8E44AD; --orange:#FF8C42;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Comic Neue','Comic Sans MS','Chalkboard SE',cursive,sans-serif;
  font-weight:700; color:var(--ink); min-height:100vh;
  background-color:#FFE45C;
  background-image:radial-gradient(#F5C400 1.6px, transparent 1.8px);
  background-size:14px 14px;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;color:inherit;cursor:pointer}
h1,h2,h3,.bang{font-family:'Bangers','Impact',sans-serif;font-weight:400;letter-spacing:1.5px;margin:0}
header{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;background:var(--red);border-bottom:4px solid var(--ink);
}
.logo{
  font-family:'Bangers',Impact,sans-serif;font-size:26px;letter-spacing:2px;color:#fff;background:none;border:none;
  text-shadow:2px 2px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink);padding:0;
}
.hbtns{display:flex;gap:8px}
.icon-btn{background:#fff;border:3px solid var(--ink);border-radius:10px;font-size:18px;padding:4px 9px;box-shadow:2px 2px 0 var(--ink)}
main{max-width:720px;margin:0 auto;padding:14px 12px 60px}
.panel{background:var(--paper);border:4px solid var(--ink);border-radius:6px;box-shadow:6px 6px 0 var(--ink);padding:14px;margin-bottom:18px;position:relative}
.btn{
  font-family:'Bangers',Impact,sans-serif;font-size:24px;letter-spacing:1.5px;
  background:var(--yellow);border:4px solid var(--ink);border-radius:10px;box-shadow:4px 4px 0 var(--ink);
  padding:10px 18px;transition:transform .08s, box-shadow .08s;
}
.btn:active,.mbtn:active,.opt:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.red{background:var(--red);color:#fff;text-shadow:1px 1px 0 var(--ink)}
.btn.blue{background:var(--blue);color:#fff;text-shadow:1px 1px 0 var(--ink)}
.btn.green{background:var(--green);color:#fff;text-shadow:1px 1px 0 var(--ink)}
.btn.big{font-size:30px;width:100%;padding:14px}
.btn.small{font-size:19px;padding:6px 12px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.center{text-align:center}

/* speech bubbles */
.bubble{
  position:relative;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 14px;font-size:17px;line-height:1.3;
}
.bubble.left::before{content:"";position:absolute;left:-14px;top:18px;border:8px solid transparent;border-right:12px solid var(--ink)}
.bubble.left::after{content:"";position:absolute;left:-9px;top:20px;border:6px solid transparent;border-right:9px solid #fff}
.bubble.down::before{content:"";position:absolute;left:28px;bottom:-16px;border:8px solid transparent;border-top:13px solid var(--ink)}
.bubble.down::after{content:"";position:absolute;left:30px;bottom:-10px;border:6px solid transparent;border-top:10px solid #fff}

/* cover */
.cover{background:var(--blue);color:#fff;text-align:center;overflow:hidden;padding:16px 12px 8px}
.cover::before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 60%, rgba(255,255,255,.13) 0 10deg, transparent 10deg 20deg);pointer-events:none}
.issue{position:absolute;top:8px;left:10px;background:#fff;color:var(--ink);border:3px solid var(--ink);font-family:Bangers,Impact,sans-serif;font-size:15px;padding:2px 8px;transform:rotate(-5deg);z-index:2}
.price{position:absolute;top:8px;right:10px;background:var(--yellow);color:var(--ink);border:3px solid var(--ink);border-radius:50%;width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-family:Bangers,Impact,sans-serif;font-size:13px;line-height:1;transform:rotate(8deg);z-index:2;text-align:center}
.title{font-size:56px;line-height:.95;color:var(--yellow);text-shadow:4px 4px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);margin-top:26px;position:relative;transform:rotate(-2deg)}
.subtitle{font-family:Bangers,Impact,sans-serif;font-size:22px;letter-spacing:1.5px;margin:6px 0 4px;position:relative;text-shadow:2px 2px 0 var(--ink)}
.heroes{display:flex;justify-content:center;align-items:flex-end;gap:6px;position:relative;margin-top:6px}
.heroes svg{height:150px;width:auto}
.rank{display:inline-block;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:20px;padding:3px 12px;font-size:15px;margin:6px 0 4px;position:relative}

/* comic strip */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px}
.strip .cpanel{border:3px solid var(--ink);border-radius:4px;padding:6px;background:#FFF8E1;display:flex;flex-direction:column;justify-content:space-between;min-height:170px}
.strip .cpanel:nth-child(2){background:#E3F2FD}
.strip .cpanel:nth-child(3){background:#FCE4EC}
.strip .say{font-size:13px;line-height:1.2;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:5px 6px}
.strip svg{height:80px;width:auto;align-self:center}
.caption{background:var(--yellow);border:2px solid var(--ink);font-size:11px;padding:2px 5px;align-self:flex-start;margin-bottom:4px}

/* map */
.maphead{display:flex;gap:10px;align-items:center}
.maphead svg{height:84px;width:auto;flex:none}
.world{border-color:var(--ink);padding-top:10px}
.world h2{font-size:30px;color:#fff;background:var(--wc);margin:-10px -14px 8px;padding:6px 14px;border-bottom:4px solid var(--ink);text-shadow:2px 2px 0 var(--ink)}
.wblurb{margin:0 0 10px;font-size:15px}
.mlist{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mbtn{background:#fff;border:3px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--ink);padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px}
.micon{font-size:34px}
.mname{font-family:Bangers,Impact,sans-serif;font-size:17px;letter-spacing:1px;line-height:1.05;text-align:center}
.mcount{font-size:11px;min-height:14px}
.newtag{background:var(--red);color:#fff;border-radius:6px;padding:1px 5px;font-size:11px}

/* question */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.mini{background:#fff;border:3px solid var(--ink);border-radius:10px;box-shadow:2px 2px 0 var(--ink);font-size:15px;padding:5px 10px;font-weight:700;white-space:nowrap}
.dots{display:flex;gap:6px}
.dot{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);background:#fff}
.dot.done{background:var(--green)}
.dot.now{background:var(--yellow);transform:scale(1.25)}
.qtype{position:absolute;top:-16px;left:12px;background:var(--yellow);border:3px solid var(--ink);font-family:Bangers,Impact,sans-serif;font-size:17px;letter-spacing:1px;padding:1px 10px;transform:rotate(-2deg)}
.qtext{font-size:19px;line-height:1.3;margin:10px 0 12px}
.qvis{display:flex;justify-content:center}
.helper{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.helper .av svg{height:66px;width:auto}
.helper .bubble{flex:1;font-size:16px;min-height:48px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{position:relative;background:#fff;border:4px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink);min-height:118px;padding:16px 8px 10px;display:flex;align-items:center;justify-content:center;transition:transform .08s}
.letter{position:absolute;top:-12px;left:-10px;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;border:3px solid var(--ink);font-family:Bangers,Impact,sans-serif;font-size:17px;display:flex;align-items:center;justify-content:center}
.opt.right{background:#C9F7C6;border-color:#0E7A35;animation:pop .35s}
.opt.right .letter{background:var(--green)}
.opt.wrong{opacity:.35;filter:grayscale(1);animation:shake .35s}
.opt:disabled{cursor:default}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.nextwrap{margin-top:16px}
.pow{position:fixed;z-index:50;pointer-events:none;font-family:Bangers,Impact,sans-serif;font-size:40px;color:var(--yellow);
  text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);
  transform:translate(-50%,-50%) scale(.3) rotate(-10deg);animation:powA .9s forwards}
.pow::before{content:"";position:absolute;inset:-26px -30px;z-index:-1;background:var(--red);
  clip-path:polygon(50% 0,61% 30%,95% 12%,72% 42%,100% 55%,68% 62%,82% 95%,52% 72%,30% 100%,32% 68%,0 78%,22% 52%,2% 25%,35% 32%);}
@keyframes powA{0%{transform:translate(-50%,-50%) scale(.3) rotate(-10deg);opacity:1}40%{transform:translate(-50%,-90%) scale(1.15) rotate(-6deg)}80%{opacity:1}100%{transform:translate(-50%,-110%) scale(1) rotate(-6deg);opacity:0}}

/* visuals */
.emo{font-size:50px;line-height:1;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;font-weight:400}
.tile{width:84px;height:84px;border:3px solid var(--ink);border-radius:10px;background:#FFF8E1;display:flex;align-items:center;justify-content:center}
.tile.q,.cell.q{background:#E3F2FD;font-family:Bangers,Impact,sans-serif;font-size:44px;color:var(--blue)}
.tile .emo{font-size:48px}
.arrow{font-size:30px;font-weight:700;padding:0 4px}
.analogy{display:flex;flex-direction:column;gap:12px;align-items:center}
.pair{display:flex;align-items:center;gap:6px}
.pairs-wrap{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}
.sep{font-family:Bangers,Impact,sans-serif;font-size:26px;color:#888}
.riddle{font-size:22px;line-height:1.3;text-align:center;background:#FFF8E1;border:3px dashed var(--ink);border-radius:12px;padding:14px}
.club{border:3px solid var(--ink);border-radius:12px;background:#FFF8E1;padding:10px 10px 12px;text-align:center}
.clublabel{font-family:Bangers,Impact,sans-serif;letter-spacing:1px;font-size:17px;margin-bottom:6px}
.row3{display:flex;gap:10px;justify-content:center}
.cell{width:88px;height:88px;border:3px solid var(--ink);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;padding:6px}
.cell svg.fig{width:100%;height:100%}
.opt svg.fig{width:100%;max-width:130px;height:84px}
.grp{display:grid;grid-template-columns:repeat(5,auto);gap:1px 2px;justify-content:center;font-size:19px;line-height:1.15;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;font-weight:400}
.opt .grp{font-size:20px}
.machine{display:flex;flex-direction:column;gap:8px;width:100%;max-width:400px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 54px minmax(0,1fr);align-items:center;gap:6px}
.mbox{border:3px solid var(--ink);border-radius:10px;background:#FFF8E1;min-height:64px;display:flex;align-items:center;justify-content:center;padding:6px}
.mrow:last-child .mbox:last-child{background:#E3F2FD}
.gear{font-size:22px;text-align:center}
.qbig{font-family:Bangers,Impact,sans-serif;font-size:38px;color:var(--blue)}
.eq{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;font-family:Bangers}
.nt{min-width:52px;height:58px;border:3px solid var(--ink);border-radius:10px;background:#FFF8E1;display:flex;align-items:center;justify-content:center;font-size:36px;padding:0 6px}
.nt.q{background:#E3F2FD;color:var(--blue)}
.op{font-size:36px}
.eqside{display:flex;align-items:center;gap:6px}
.bigeq{font-size:44px;padding:0 4px;color:var(--red)}
.optnum{font-family:Bangers,Impact,sans-serif;font-size:48px}
.balance{display:flex;flex-direction:column;gap:8px;align-items:stretch;width:100%;max-width:420px}
.brow{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px;align-items:center}
.blabel{font-family:Bangers,Impact,sans-serif;font-size:16px;width:56px}
.bplus{font-family:Bangers,Impact,sans-serif;font-size:28px}
.abacus{height:170px;width:auto;max-width:100%}
.opt .abacus{height:100px}
.matrix{display:grid;grid-template-columns:auto auto auto;gap:8px;align-items:center;justify-items:center}
.marrow{font-size:26px}
.pfsteps{display:flex;gap:8px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.pfstep{display:flex;flex-direction:column;align-items:center;gap:4px}
.pflabel{font-family:Bangers,Impact,sans-serif;font-size:15px;letter-spacing:1px;background:var(--yellow);border:2px solid var(--ink);padding:0 6px}
.pfstep svg{width:100px;height:100px;background:#fff;border:3px solid var(--ink);border-radius:8px}
.opt svg.paper{width:92px;height:92px}

/* complete */
.burstbig{display:inline-block;font-family:Bangers,Impact,sans-serif;font-size:38px;color:#fff;background:var(--red);padding:16px 26px;border:4px solid var(--ink);transform:rotate(-3deg);text-shadow:2px 2px 0 var(--ink);box-shadow:5px 5px 0 var(--ink);margin:6px 0 12px}
.newsticker{font-size:76px;display:inline-block;animation:spin 1s ease-out;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
@keyframes spin{from{transform:scale(.2) rotate(-180deg)}to{transform:scale(1) rotate(0)}}
.brk{background:#E3F2FD;text-align:left}
.brk h3{font-size:26px;color:var(--blue)}
.brk p{font-size:20px;margin:6px 0 0}
.bonus{background:#FCE4EC;text-align:left;font-size:16px}
.zaps{font-size:18px}

/* checklist */
.checklist h2{font-size:28px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ccount{font-size:18px;background:var(--green);color:#fff;border:3px solid var(--ink);border-radius:20px;padding:2px 12px;text-shadow:1px 1px 0 var(--ink)}
.checklist>.note{margin:4px 0 0}
.cworld{margin-top:12px}
.cwname{font-family:Bangers,Impact,sans-serif;font-size:19px;letter-spacing:1px;color:#fff;text-shadow:1px 1px 0 var(--ink);background:var(--wc);border:3px solid var(--ink);border-bottom:none;border-radius:8px 8px 0 0;padding:2px 12px;display:inline-block}
.citem{display:flex;align-items:center;gap:10px;width:100%;background:#fff;border:3px solid var(--ink);margin-top:-3px;padding:8px 10px;text-align:left;font-size:17px;font-weight:700;border-radius:0}
.cworld .cwname+.citem{border-top-right-radius:8px}
.cworld .citem:last-child{border-radius:0 0 8px 8px}
.cbox{width:30px;height:30px;flex:none;border:3px solid var(--ink);border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;font-weight:900;text-shadow:1px 1px 0 var(--ink)}
.cname{flex:1}
.cstat{font-family:Bangers,Impact,sans-serif;letter-spacing:1px;font-size:15px;padding:1px 8px;border:2px solid var(--ink);border-radius:12px;background:#eee;white-space:nowrap}
.citem.aced{background:#D7F8D4}
.citem.aced .cbox{background:var(--green)}
.citem.aced .cstat{background:var(--yellow);transform:rotate(-5deg)}
.citem.played .cstat{background:#FFF1B8}
.allaced{margin-top:12px;text-align:center;font-family:Bangers,Impact,sans-serif;font-size:24px;letter-spacing:1px;background:var(--yellow);border:3px solid var(--ink);border-radius:10px;padding:6px}
.acestamp{display:inline-block;font-family:Bangers,Impact,sans-serif;font-size:36px;letter-spacing:2px;color:var(--green);border:5px solid var(--green);border-radius:10px;padding:0 16px;transform:rotate(-8deg);margin:8px 0 4px;background:#fff;animation:stamp .5s ease-out}
@keyframes stamp{from{transform:scale(2.2) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}
.mbtn.aced{background:#D7F8D4}
.acetag{background:var(--green);color:#fff;border-radius:6px;padding:1px 6px;font-size:11px;border:2px solid var(--ink)}

/* vault */
.vault{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.slot{aspect-ratio:1;border:3px solid var(--ink);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:34px;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.slot.locked{background:#ddd;color:#999;font-family:Bangers,Impact,sans-serif;font-size:28px}

/* grown-ups */
.grown{font-weight:400;font-size:16px;line-height:1.5}
.grown h2{font-size:30px;margin-bottom:6px}
.grown h3{font-size:22px;margin:14px 0 4px;color:var(--blue)}
.grown b{font-weight:700}
.grown ul{padding-left:20px;margin:6px 0}
.grown li{margin-bottom:6px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.tbl th,.tbl td{border:2px solid var(--ink);padding:5px 6px;text-align:left;vertical-align:top}
.tbl th{background:var(--yellow);font-family:Bangers,Impact,sans-serif;font-weight:400;letter-spacing:1px;font-size:15px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:2px dashed #ccc}
.sw{width:58px;height:32px;border-radius:20px;border:3px solid var(--ink);background:#ccc;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:left .15s}
.sw.on{background:var(--green)}
.sw.on::after{left:27px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal .panel{max-width:360px}
.note{font-size:13px;color:#444}
.intro .bubble{font-size:18px}
.intro svg{height:110px;width:auto}

/* challenge mode */
.modebar{display:flex;gap:0;margin-bottom:16px;border:4px solid var(--ink);border-radius:12px;overflow:hidden;box-shadow:4px 4px 0 var(--ink);background:#fff}
.modebtn{flex:1;font-family:Bangers,Impact,sans-serif;font-size:22px;letter-spacing:1.5px;padding:10px 6px;border:none;background:#fff;color:#888}
.modebtn+.modebtn{border-left:4px solid var(--ink)}
.modebtn.on{background:var(--blue);color:#fff;text-shadow:1px 1px 0 var(--ink)}
.modebar.gold .modebtn.on{background:linear-gradient(135deg,#FFD93D,#FF8C42);color:var(--ink);text-shadow:none}
.goldpanel{background:linear-gradient(180deg,#FFF8DC,#FFFFFF 40%);border-color:#B8860B;box-shadow:6px 6px 0 #8B6508}
.world.goldpanel h2{background:linear-gradient(90deg,var(--wc),#FFB800)}
.mbtn.golded{background:#FFF1B8}
.goldtag{background:linear-gradient(135deg,#FFD93D,#FF8C42);color:var(--ink)}
.arcbtn{background:linear-gradient(135deg,#8E44AD,#2F80ED);color:#fff;text-shadow:2px 2px 0 var(--ink)}
.arcbtn small{font-family:'Comic Neue',sans-serif;font-weight:700;font-size:15px;letter-spacing:0}
.ccount.gold{background:linear-gradient(135deg,#FFD93D,#FF8C42);color:var(--ink);text-shadow:none}
.citem .cname{flex:1;background:none;border:none;text-align:left;font-size:17px;font-weight:700;padding:4px 0}
.citem .cbox{cursor:pointer;padding:0}
.cbox.goldbox{font-size:16px;color:#bbb;text-shadow:none;background:#fff}
.cbox.goldbox.on{background:linear-gradient(135deg,#FFD93D,#FF8C42);color:var(--ink);font-size:20px}
.citem.golded{background:#FFF1B8}
.citem.golded .cstat{background:linear-gradient(135deg,#FFD93D,#FF8C42);transform:rotate(-5deg)}
.goldstamp{color:#B8860B;border-color:#DAA520}
.tokenwin{background:linear-gradient(135deg,#EDE7F6,#E3F2FD)}
.tokenwin.dim{background:#fff;font-size:15px}
.wtile{min-width:76px;height:56px;border:3px solid var(--ink);border-radius:10px;background:#FFF8E1;display:flex;align-items:center;justify-content:center;font-size:21px;padding:0 10px;font-weight:700}
.wtile.q{background:#E3F2FD;font-family:Bangers,Impact,sans-serif;font-size:36px;color:var(--blue)}
.row3.wrap{flex-wrap:wrap}
.optword{font-size:24px;font-weight:700}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--ink)}
.numbig{font-family:Bangers,Impact,sans-serif;font-size:40px}
.seq{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px;font-family:Bangers,Impact,sans-serif}
.seq .nt{min-width:48px;font-size:32px}
.comma{font-size:30px}
.keybox{display:flex;gap:14px;justify-content:center;font-size:26px;font-weight:700;background:#FFF1B8;border:3px dashed var(--ink);border-radius:10px;padding:6px 10px;margin:0 auto 12px;width:max-content;max-width:100%}
.keybox span{font-family:'Comic Neue','Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;white-space:nowrap}
.nt.emo-t{font-size:30px;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.matrix3{display:grid;grid-template-columns:repeat(3,auto);gap:6px;justify-content:center}
.matrix3 .cell{width:80px;height:80px}

/* arcade */
.arcadehead{background:linear-gradient(135deg,#2F80ED,#8E44AD);color:#fff}
.arcadehead h2{text-shadow:3px 3px 0 var(--ink)}
.tokens{display:inline-block;font-size:26px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:30px;padding:4px 18px;margin-top:6px}
.heropick{display:flex;flex-wrap:wrap;gap:6px}
.hp{width:48px;height:48px;font-size:28px;border:3px solid var(--ink);border-radius:10px;background:#fff;padding:0;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.hp.on{background:var(--yellow);transform:scale(1.12);box-shadow:2px 2px 0 var(--ink)}
.games{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:760px){.games{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.games{grid-template-columns:1fr}}
.game .gicon{font-size:50px}
.game h3{font-size:26px}
.game p{font-size:15px;margin:6px 0}
.btn:disabled{opacity:.45;filter:grayscale(.6);cursor:not-allowed}
.arc{position:fixed;inset:0;z-index:80;background:#0B1026;display:flex;flex-direction:column}
.arcbar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--red);border-bottom:4px solid var(--ink)}
.arctitle{font-family:Bangers,Impact,sans-serif;font-size:24px;letter-spacing:1.5px;color:#fff;text-shadow:2px 2px 0 var(--ink)}
.arcstage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:8px;min-height:0}
.arcstage canvas{border:4px solid var(--ink);border-radius:8px;box-shadow:0 0 0 3px #FFD93D;background:#000;touch-action:none}
.arcmsg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(11,16,38,.55)}
.arcover{max-width:380px;width:100%}
.archelp{color:#cfd8ff;text-align:center;font-size:14px;padding:6px 10px 10px}
body.noscroll{overflow:hidden}
.art{width:60px;height:60px;display:block}
.tile .art{width:58px;height:58px}
.opt .art{width:66px;height:66px}
.grp .art.artmini{width:30px;height:30px}
.opt .grp .art.artmini{width:30px;height:30px}
.grp{gap:2px 3px}
.art.eqart{width:36px;height:36px}
.art.keyart{width:30px;height:30px;display:inline-block;vertical-align:middle}
@media (max-width:420px){.tile .art{width:48px;height:48px}.grp .art.artmini,.opt .grp .art.artmini{width:25px;height:25px}.mbox .grp .art.artmini{width:20px;height:20px}}
.mbtn{position:relative}
.mbtn.bonusm{box-shadow:3px 3px 0 var(--ink),0 0 0 3px #2BB673 inset}
.bonustag{position:absolute;top:-11px;right:-8px;background:var(--green);color:#fff;border:2px solid var(--ink);border-radius:8px;font-size:12px;font-weight:700;padding:1px 5px;transform:rotate(6deg);text-shadow:none;font-family:'Comic Neue',sans-serif}
.bonustag.inline{position:static;display:inline-block;font-size:16px;vertical-align:middle}
.costbtn{width:40px;height:36px;border:3px solid var(--ink);border-radius:8px;background:#fff;font-family:Bangers,Impact,sans-serif;font-size:20px}
.costbtn.on{background:var(--yellow);box-shadow:2px 2px 0 var(--ink)}
.catchbtn{width:100%;margin-bottom:18px;font-size:28px;line-height:1.1}
.catchbtn small{font-family:'Comic Neue',sans-serif;font-weight:700;font-size:16px;letter-spacing:0;text-shadow:none}
.freepill{display:inline-block;font-size:16px;background:var(--yellow);color:var(--ink);border:2px solid var(--ink);border-radius:20px;padding:0 8px;vertical-align:middle;text-shadow:none;transform:rotate(-4deg)}
.freegame{background:#E8FBEA}
.freetag{position:absolute;top:-14px;right:-10px;background:var(--green);color:#fff;font-family:Bangers,Impact,sans-serif;font-size:20px;letter-spacing:1px;border:3px solid var(--ink);border-radius:10px;padding:2px 10px;transform:rotate(8deg);text-shadow:1px 1px 0 var(--ink)}

@media (max-width:420px){
  .matrix3 .cell{width:70px;height:70px}
  .wtile{min-width:64px;font-size:18px}

  .title{font-size:46px}
  .tile{width:70px;height:70px}.tile .emo{font-size:40px}
  .cell{width:76px;height:76px}
  .strip .say{font-size:12px}
  .mname{font-size:15px}
  .opt{min-height:108px}
}
@media (max-width:380px){.mbox .grp .art.artmini{width:17px;height:17px}.blabel{width:46px;font-size:13px}.mbox{padding:4px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

let AC=null;
function sfx(kind){
  if(!P.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const notes=kind==='yay'?[523,659,784,1047]:[262,196];
    notes.forEach((f,i)=>{
      const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*0.08;
      o.type=kind==='yay'?'triangle':'sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.18,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.22);
    });
  }catch(e){}
}
function speak(t){
  try{
    if(!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t.replace(/<[^>]+>/g,''));
    u.rate=0.9;u.pitch=1.05;speechSynthesis.speak(u);
  }catch(e){}
}
function toggleSound(){P.sound=!P.sound;save();updSnd();}
function updSnd(){document.getElementById('sndBtn').textContent=P.sound?'🔔':'🔕';}

const OBJ=['🍎','⭐','🐞','🍪','🚀','🐟','🍩','⚽','🎈','🍓'];
function genNA(){
  const rules=[
    {f:x=>x+1,ok:x=>x<=9,say:'adds 1'},{f:x=>x+2,ok:x=>x<=8,say:'adds 2'},{f:x=>x+3,ok:x=>x<=7,say:'adds 3'},
    {f:x=>x-1,ok:x=>x>=2,say:'takes away 1'},{f:x=>x-2,ok:x=>x>=3,say:'takes away 2'},{f:x=>x-3,ok:x=>x>=4,say:'takes away 3'},
    {f:x=>x*2,ok:x=>x<=5,say:'doubles it'},{f:x=>x/2,ok:x=>x%2===0&&x<=10,say:'cuts it in half'}];
  for(let t=0;t<100;t++){
    const r=pick(rules);
    const pool=[];for(let x=1;x<=10;x++) if(r.ok(x)) pool.push(x);
    if(pool.length<3) continue;
    const xs=shuffle(pool).slice(0,3);
    const ans=r.f(xs[2]);
    const others=rules.filter(o=>o!==r&&o.ok(xs[2])).map(o=>o.f(xs[2]));
    const cands=shuffle([...new Set([ans+1,ans-1,xs[2],...others])]).filter(v=>v>=1&&v<=12&&v!==ans);
    if(cands.length<3) continue;
    const e=pick(OBJ);
    const rows=xs.map((x,i)=>`<div class="mrow"><div class="mbox">${grp(x,e)}</div><div class="gear">⚙️➜</div><div class="mbox">${i<2?grp(r.f(x),e):'<span class="qbig">?</span>'}</div></div>`).join('');
    return mk('na',`<div class="machine">${rows}</div>`,grp(ans,e),cands.slice(0,3).map(v=>grp(v,e)),
      `The machine ${r.say}! ${xs[0]} became ${r.f(xs[0])}, and ${xs[1]} became ${r.f(xs[1])}. So ${xs[2]} becomes ${ans}.`,
      {speak:'Look at the number machine. It changes each group the same way. What comes out of the machine at the end?'});
  }
}
function genNP(){
  for(let t=0;t<100;t++){

      const a=1+rnd(6),b=1+rnd(6),T=a+b,c=1+rnd(T-1),ans=T-c;
      if(c===a||c===b) continue;
      const cands=shuffle([...new Set([ans+1,ans-1,ans+2,T,c])]).filter(v=>v>=1&&v<=10&&v!==ans);
      if(cands.length<3) continue;
      const e=pick(OBJ);
      const prompt=`<div class="balance">
        <div class="brow"><span class="blabel">TOP</span><div class="mbox">${grp(a,e)}</div><span class="bplus">+</span><div class="mbox">${grp(b,e)}</div></div>
        <div class="brow"><span class="blabel">BOTTOM</span><div class="mbox">${grp(c,e)}</div><span class="bplus">+</span><div class="mbox"><span class="qbig">?</span></div></div></div>`;
      return mk('np',prompt,grp(ans,e),cands.slice(0,3).map(v=>grp(v,e)),
        `The top row has ${a} + ${b} = ${T}. The bottom row has ${c}, so it needs ${ans} more to make ${T}.`,
        {text:'Both rows need the <u>same number</u>. How many go in the <b>?</b> box?',speak:'Both rows need the same number of things. How many should go in the empty box with the question mark?'});
    }

    else{const n=pick([2,3]);const xs=Array.from({length:n},()=>1+rnd(n===2?9:6));leftT=xs.flatMap((x,i)=>i?['+',x]:[x]);L=xs.reduce((s,v)=>s+v,0);}
    if(L<3) continue;
    const m=pick([1,1,2]);const known=[];let s=0;
    for(let i=0;i<m;i++){const mx=Math.min(9,L-1-s);if(mx<1)break;const v=1+rnd(mx);known.push(v);s+=v;}
    if(!known.length) continue;

    const qFirst=Math.random()<0.3;
    const rightT=qFirst?['?',...known.flatMap(k=>['+',k])]:[...known.flatMap((k,i)=>i?['+',k]:[k]),'+','?'];
    const cands=shuffle([...new Set([ans+1,ans-1,ans+2,L])]).filter(v=>v>=1&&v!==ans);
    if(cands.length<3) continue;
    const tok=x=>x==='?'?'<span class="nt q">?</span>':(typeof x==='number'?`<span class="nt">${x}</span>`:`<span class="op">${x}</span>`);
    const prompt=`<div class="eq"><div class="eqside">${leftT.map(tok).join('')}</div><span class="bigeq">=</span><div class="eqside">${rightT.map(tok).join('')}</div></div>`;
    return mk('np',prompt,`<span class="optnum">${ans}</span>`,cands.slice(0,3).map(v=>`<span class="optnum">${v}</span>`),
      `The left side makes ${L}. The right side has ${s} so far, and ${s} + ${ans} = ${L}. Balanced!`,
      {speak:`${leftT.join(' ').replace('−','minus')} equals ${rightT.join(' ').replace('?','what number')}. Both sides must be equal.`});
  }
}
function abacus(vals,q){

  let s=`<svg class="abacus" viewBox="0 0 ${W} 12" xmlns="http://www.w3.org/2000/svg"><rect x="0.05" y="10.7" width="${W-0.1}" height="0.9" rx="0.3" fill="#8B5A2B" stroke="#111" stroke-width="0.12"/>`;
  vals.forEach((v,i)=>{
    const x=0.75+i*1.5;
    s+=`<line x1="${x}" y1="0.6" x2="${x}" y2="10.7" stroke="#555" stroke-width="0.16"/>`;
    for(let b=0;b<v;b++){s+=`<ellipse cx="${x}" cy="${10.2-b*0.95}" rx="0.6" ry="0.42" fill="${b<5?'#E63946':'#2F80ED'}" stroke="#111" stroke-width="0.09"/>`;}
  });
  if(q){const x=0.75+vals.length*1.5;s+=`<line x1="${x}" y1="0.6" x2="${x}" y2="10.7" stroke="#2F80ED" stroke-width="0.16" stroke-dasharray="0.4 0.3"/><text x="${x}" y="6.6" font-size="3.6" text-anchor="middle" font-family="Bangers,Impact" fill="#2F80ED" stroke="#111" stroke-width="0.08">?</text>`;}
  return s+'</svg>';
}
function genNS(){

function poly(pts){return `<polygon points="${pts.map(p=>p.map(v=>v.toFixed(3)).join(',')).join(' ')}"/>`;}
function regPts(n,r,off){const a=[];for(let i=0;i<n;i++){const t=off+i*2*Math.PI/n;a.push([r*Math.cos(t),r*Math.sin(t)]);}return a;}
function starPts(){const a=[];for(let i=0;i<10;i++){const r=i%2?0.43:1,t=-Math.PI/2+i*Math.PI/5;a.push([r*Math.cos(t),r*Math.sin(t)]);}return a;}

function arrowV(x0,x1,y){ // curved arrow above, left to right
  const mx=(x0+x1)/2;
  return `<path d="M${x0},${y} Q${mx},${y-0.9} ${x1},${y}" fill="none" stroke="#E63946" stroke-width="0.16"/>
  <polygon points="${x1},${y} ${x1-0.47},${y-0.085} ${x1-0.13},${y-0.455}" fill="#E63946"/>`;
}
function arrowH(y0,y1,x){ // curved arrow at left, top to bottom
  const my=(y0+y1)/2;
  return `<path d="M${x},${y0} Q${x-0.9},${my} ${x},${y1}" fill="none" stroke="#E63946" stroke-width="0.16"/>
  <polygon points="${x},${y1} ${x-0.085},${y1-0.47} ${x-0.455},${y1-0.13}" fill="#E63946"/>`;
}
function paper({region=[0,0,4,4],holes=[],shade=false,ghost=false,extra='',tight=false}={},cls='paper'){
  const [x,y,w,h]=region;
  let s=`<svg class="${cls}" viewBox="${tight?'-0.25 -0.25 4.5 4.5':'-1.2 -1.2 6.4 6.4'}" xmlns="http://www.w3.org/2000/svg">`;
  if(ghost) s+=`<rect x="0" y="0" width="4" height="4" fill="none" stroke="#bbb" stroke-width="0.07" stroke-dasharray="0.2 0.15"/>`;
  s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${shade?'#FFD77A':'#FFF6D6'}" stroke="#111" stroke-width="0.14"/>`;
  holes.forEach(([r,c])=>{s+=`<circle cx="${c+0.5}" cy="${r+0.5}" r="0.3" fill="#111"/>`;});
  return s+extra+'</svg>';
}
const hkey=hs=>[...new Set(hs.map(p=>p.join(',')))].sort().join(';');
function genPF(){
  for(let t=0;t<200;t++){
    const fold=pick(['v','h','v','h','vh']);
    const nh=fold==='vh'?1:pick([1,1,2]);
    const rows=fold==='v'?[0,1,2,3]:[2,3], cols=fold==='h'?[0,1,2,3]:[2,3];
    const H=[];let guard=0;
    while(H.length<nh&&guard++<20){const p=[pick(rows),pick(cols)];if(!H.some(q=>q[0]===p[0]&&q[1]===p[1]))H.push(p);}
    const mv=p=>[p[0],3-p[1]],mh=p=>[3-p[0],p[1]],tv=p=>[p[0],p[1]-2],th=p=>[p[0]-2,p[1]];
    let correct,d,steps,why;
    if(fold==='v'){
      correct=[...H,...H.map(mv)];d=[H,[...H,...H.map(tv)],[...H,...H.map(mh)]];
      steps=[['1. FOLD',paper({extra:`<line x1="2" y1="-0.2" x2="2" y2="4.2" stroke="#111" stroke-width="0.1" stroke-dasharray="0.25 0.15"/>${arrowV(0.8,3.2,-0.25)}`})],
             ['2. PUNCH',paper({region:[2,0,2,4],holes:H,shade:true,ghost:true})]];
      why='The fold line is like a mirror. Each hole gets a twin on the other side, the same distance from the fold!';
    }else if(fold==='h'){
      correct=[...H,...H.map(mh)];d=[H,[...H,...H.map(th)],[...H,...H.map(mv)]];
      steps=[['1. FOLD',paper({extra:`<line x1="-0.2" y1="2" x2="4.2" y2="2" stroke="#111" stroke-width="0.1" stroke-dasharray="0.25 0.15"/>${arrowH(0.8,3.2,-0.25)}`})],
             ['2. PUNCH',paper({region:[0,2,4,2],holes:H,shade:true,ghost:true})]];
      why='The paper folded down from the top, so each hole gets a mirror twin above the fold line!';
    }else{
      const mvh=p=>mv(mh(p)),tvh=p=>tv(th(p));
      correct=[...H,...H.map(mv),...H.map(mh),...H.map(mvh)];
      d=[[...H,...H.map(mv)],[...H,...H.map(tv),...H.map(th),...H.map(tvh)],[...H,...H.map(mv),...H.map(mh)]];
      steps=[['1. FOLD',paper({extra:`<line x1="2" y1="-0.2" x2="2" y2="4.2" stroke="#111" stroke-width="0.1" stroke-dasharray="0.25 0.15"/>${arrowV(0.8,3.2,-0.25)}`})],
             ['2. FOLD',paper({region:[2,0,2,4],shade:true,ghost:true,extra:`<line x1="1.8" y1="2" x2="4.2" y2="2" stroke="#111" stroke-width="0.1" stroke-dasharray="0.25 0.15"/>${arrowH(0.8,3.2,1.75)}`})],
             ['3. PUNCH',paper({region:[2,2,2,2],holes:H,shade:true,ghost:true})]];
      why='Two folds make FOUR layers of paper. So one punch makes 4 holes — one in every corner part!';
    }
    const keys=[correct,...d].map(hkey);
    if(new Set(keys).size!==4) continue;
    const prompt=`<div class="pfsteps">${steps.map(([l,s])=>`<div class="pfstep"><span class="pflabel">${l}</span>${s}</div>`).join('')}<div class="pfstep"><span class="pflabel">OPEN = ?</span><svg class="paper" viewBox="0 0 10 10" style="width:100px;height:100px;background:#E3F2FD;border:3px solid #111;border-radius:8px"><text x="5" y="7.3" font-size="6" text-anchor="middle" font-family="Bangers,Impact" fill="#2F80ED">?</text></svg></div></div>`;
    const dedupe=hs=>[...new Set(hs.map(p=>p.join(',')))].map(s=>s.split(',').map(Number));
    return mk('pf',prompt,paper({holes:dedupe(correct),tight:true}),d.map(x=>paper({holes:dedupe(x),tight:true})),why,
      {speak:'The paper was folded, and then holes were punched through it. What will the paper look like when you open it back up?'});
  }
}

                 ['2. FOLD',paper({region:[0,0,2,4],shade:true,ghost:true,extra:DASH(-0.2,2,2.2,2)+curvedArrow(2.25,3.2,2.25,0.8,0.9)})],
                 ['3. PUNCH',paper({region:[0,0,2,2],holes:H,shade:true,ghost:true})]]

                 ['3. PUNCH',paper({region:[2,2,2,2],holes:H,shade:true,ghost:true})]];

    }else{

/* ---------- Pong ---------- */
function pongGame(cv,ctx,api){
  const W=800,H=500;cv.width=W;cv.height=H;
  const PW=34,PH=108,PHP=132,PM=18,PSPEED=560,BS=28;
  const hero=heroSticker(),cpuS=pick(enemyStickers(hero));
  const L={x:PM,y:H/2-PHP/2,h:PHP},R={x:W-PM-PW,y:H/2-PH/2,h:PH};
  const ball={x:W/2-BS/2,y:H/2-BS/2,vx:0,vy:0,spin:0};
  let lives=3,score=0,wins=0,mode='serve',serveT=1.0,serveDir=-1,cpuTarget=H/2,think=0,flash=null,flashT=0;
  const cpuSpeed=()=>Math.min(320,135+wins*12);
  const cpuErr=()=>Math.max(0.8,1.9-wins*0.07)*PH;
  const startSpeed=()=>250+Math.min(wins,15)*8;
  function serve(){ball.x=W/2-BS/2;ball.y=H/2-BS/2;ball.vx=ball.vy=0;serveT=0.9;mode='serve';}
  function launch(){const a=Math.random()*0.8-0.4;ball.vx=Math.cos(a)*startSpeed()*serveDir;ball.vy=Math.sin(a)*startSpeed();mode='play';}
  function say(t){flash=t;flashT=0.9;}
  function predict(){if(ball.vx<=0) return H/2;const t=(R.x-(ball.x+BS))/ball.vx;let y=ball.y+ball.vy*t;const span=H-BS;y=((y%(2*span))+2*span)%(2*span);if(y>span)y=2*span-y;return y+BS/2;}
  function hit(p){return ball.x<p.x+PW&&ball.x+BS>p.x&&ball.y<p.y+p.h&&ball.y+BS>p.y;}
  function bounce(p,dir){
    const rel=((ball.y+BS/2)-(p.y+p.h/2))/(p.h/2),ang=Math.max(-1,Math.min(1,rel))*(Math.PI/3.2);
    const sp=Math.min(620,Math.hypot(ball.vx,ball.vy)*1.04);ball.vx=Math.cos(ang)*sp*dir;ball.vy=Math.sin(ang)*sp;
    ball.x=dir>0?p.x+PW:p.x-BS;beepA(dir>0?520:440);
  }
  function update(dt){
    if(flashT>0) flashT-=dt;
    // player
    const k=api.keys,dirK=((k.has('arrowdown')||k.has('s'))?1:0)-((k.has('arrowup')||k.has('w'))?1:0);
    if(dirK) L.y+=dirK*PSPEED*dt;
    else if(api.ptr.active){const tgt=api.ptr.y-PHP/2,st=PSPEED*1.8*dt;L.y+=Math.max(-st,Math.min(st,tgt-L.y));}
    L.y=Math.max(0,Math.min(H-PHP,L.y));
    // cpu
    think-=dt;if(think<=0){think=0.25;cpuTarget=(ball.vx>0&&ball.x>W*0.55)?predict()+(Math.random()-0.5)*cpuErr():H/2;}
    const st=cpuSpeed()*dt;R.y+=Math.max(-st,Math.min(st,cpuTarget-(R.y+PH/2)));R.y=Math.max(0,Math.min(H-PH,R.y));
    if(mode==='serve'){serveT-=dt;if(serveT<=0) launch();return;}
    ball.spin+=dt*(ball.vx>0?8:-8);
    const steps=Math.max(1,Math.ceil(Math.hypot(ball.vx,ball.vy)*dt/(BS/2))),sdt=dt/steps;
    for(let i=0;i<steps;i++){
      ball.x+=ball.vx*sdt;ball.y+=ball.vy*sdt;
      if(ball.y<=0){ball.y=0;ball.vy=Math.abs(ball.vy);beepA(300,0.04);}
      if(ball.y+BS>=H){ball.y=H-BS;ball.vy=-Math.abs(ball.vy);beepA(300,0.04);}
      if(ball.vx<0&&hit(L)){bounce(L,1);score+=1;}
      if(ball.vx>0&&hit(R)){bounce(R,-1);}
      if(ball.x+BS<0){lives--;beepA(160,0.35,'triangle',0.1);serveDir=-1;
        if(lives<=0){mode='over';api.end(score);return;}say(['MISSED!','OOPS!','WHOOSH!'][rnd(3)]);serve();return;}
      if(ball.x>W){score+=5;wins++;beepA(660,0.2,'triangle',0.1);say(pick(['POW! +5','KAPOW! +5','BAM! +5','SCORE! +5']));serveDir=1;serve();return;}
    }
  }
  function bumper(p,e,col){
    ctx.fillStyle=col;ctx.strokeStyle='#111';ctx.lineWidth=4;
    ctx.beginPath();ctx.roundRect?ctx.roundRect(p.x,p.y,PW,p.h,10):ctx.rect(p.x,p.y,PW,p.h);ctx.fill();ctx.stroke();
    const n=p.h>PH?4:3;for(let i=0;i<n;i++) drawE(ctx,e,p.x+PW/2,p.y+p.h/(2*n)+i*p.h/n,26);
  }
  function render(){
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1D2B53');g.addColorStop(1,'#0B1026');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,255,255,0.06)';for(let x=10;x<W;x+=22)for(let y=10;y<H;y+=22){ctx.beginPath();ctx.arc(x,y,1.5,0,7);ctx.fill();}
    ctx.fillStyle='rgba(255,217,61,0.5)';for(let y=8;y<H;y+=30) ctx.fillRect(W/2-3,y,6,16);
    bumper(L,hero,'#E63946');bumper(R,cpuS,'#2F80ED');
    if(mode!=='serve'||Math.floor(serveT*6)%2===0){ctx.save();ctx.translate(ball.x+BS/2,ball.y+BS/2);ctx.rotate(ball.spin);drawE(ctx,'🧇',0,0,BS);ctx.restore();}
    ctx.textAlign='left';ctx.textBaseline='top';
    for(let i=0;i<3;i++) drawE(ctx,i<lives?'❤️':'🖤',24+i*30,22,22);
    comicText(ctx,'SCORE '+score,W/2,30,34);
    comicText(ctx,'BEST '+((P.best&&P.best.pong)||0),W-80,26,20,'#fff');
    if(flashT>0&&flash) comicText(ctx,flash,W/2,H/2,64+(0.9-flashT)*30,'#FFD93D');
  }
  return {update,render,state:()=>({ball,L,wins,lives,score})};
}

/* ---------- Invaders ---------- */
function invadersGame(cv,ctx,api){
  const W=480,H=600;cv.width=W;cv.height=H;
  const hero=heroSticker(),pool=enemyStickers(hero);
  const pl={x:W/2,y:H-46,frozen:0};let shots=[],bombs=[],inv=[],booms=[],dir=1,wave=0,score=0,cool=0,flash=null,flashT=0,t=0,total=0;
  const stars=Array.from({length:60},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.6+0.4}));
  function spawn(){
    wave++;inv=[];const rows=4,cols=6,picks=shuffle(pool);const top=56+Math.min(wave-1,6)*14;
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++) inv.push({x:62+c*66,y:top+r*50,e:picks[(r*2+(c%2))%picks.length],alive:true});
    total=inv.length;dir=1;if(wave>1){flash=`WAVE ${wave}!`;flashT=1.2;}
  }
  spawn();
  const speed=()=>{const alive=inv.filter(i=>i.alive).length;return (28+wave*10)*(1+(1-alive/total)*1.8);};
  function update(dt){
    t+=dt;if(flashT>0) flashT-=dt;if(cool>0) cool-=dt;if(pl.frozen>0) pl.frozen-=dt;
    const k=api.keys;
    if(pl.frozen<=0){
      const dk=((k.has('arrowright')||k.has('d'))?1:0)-((k.has('arrowleft')||k.has('a'))?1:0);
      if(dk) pl.x+=dk*300*dt;else if(api.ptr.active){const st=420*dt;pl.x+=Math.max(-st,Math.min(st,api.ptr.x-pl.x));}
      pl.x=Math.max(24,Math.min(W-24,pl.x));
      const fire=k.has(' ')||(api.ptr.down);
      if(fire&&cool<=0&&shots.length<3){shots.push({x:pl.x,y:pl.y-26});cool=0.3;beepA(880,0.05,'square',0.04);}
    }
    // invaders move
    const alive=inv.filter(i=>i.alive);const v=speed()*dir*dt;let edge=false;
    alive.forEach(i=>{i.x+=v;if(i.x<22||i.x>W-22) edge=true;});
    if(edge){dir*=-1;alive.forEach(i=>{i.x=Math.max(22,Math.min(W-22,i.x));i.y+=18;});beepA(110,0.08,'triangle',0.05);}
    // bombs
    if(Math.random()<dt*(0.5+wave*0.15)&&alive.length){
      const cols={};alive.forEach(i=>{const key=Math.round(i.x/30);if(!cols[key]||cols[key].y<i.y) cols[key]=i;});
      const shooters=Object.values(cols),s=pick(shooters);bombs.push({x:s.x,y:s.y+20,vy:150+wave*15});
    }
    shots.forEach(s=>s.y-=520*dt);shots=shots.filter(s=>s.y>-20);
    bombs.forEach(b=>b.y+=b.vy*dt);bombs=bombs.filter(b=>b.y<H+20);
    // hits
    shots.forEach(s=>{for(const i of alive){if(i.alive&&Math.abs(s.x-i.x)<22&&Math.abs(s.y-i.y)<20){i.alive=false;s.y=-99;score+=10;booms.push({x:i.x,y:i.y,t:0.35});beepA(240+Math.random()*80,0.08,'sawtooth',0.05);break;}}});
    bombs.forEach(b=>{if(pl.frozen<=0&&Math.abs(b.x-pl.x)<22&&Math.abs(b.y-pl.y)<22){pl.frozen=1.0;b.y=H+99;flash='FROZEN!';flashT=0.8;beepA(150,0.3,'sine',0.08);}});
    booms.forEach(b=>b.t-=dt);booms=booms.filter(b=>b.t>0);
    // landed?
    if(alive.some(i=>i.alive&&i.y+18>=pl.y-20)){flash='THEY LANDED!';flashT=2;api.end(score);return;}
    if(!inv.some(i=>i.alive)){score+=50;beepA(990,0.25,'triangle',0.08);shots=[];bombs=[];spawn();}
  }
  function render(){
    ctx.fillStyle='#0B1026';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';stars.forEach(s=>{ctx.globalAlpha=0.4+0.4*Math.sin(t*2+s.x);ctx.fillRect(s.x,s.y,s.s,s.s);});ctx.globalAlpha=1;
    ctx.fillStyle='#2BB673';ctx.fillRect(0,H-14,W,14);ctx.fillStyle='#111';ctx.fillRect(0,H-16,W,3);
    inv.forEach(i=>{if(i.alive) drawE(ctx,i.e,i.x,i.y+Math.sin(t*6+i.x)*2,32);});
    booms.forEach(b=>{comicText(ctx,'POW',b.x,b.y,18+(0.35-b.t)*40,'#FFD93D');});
    ctx.fillStyle='#FFD93D';shots.forEach(s=>{ctx.fillRect(s.x-3,s.y-12,6,16);});
    bombs.forEach(b=>drawE(ctx,'❄️',b.x,b.y,18));
    if(pl.frozen>0){ctx.fillStyle='rgba(92,225,230,0.35)';ctx.beginPath();ctx.arc(pl.x,pl.y,28,0,7);ctx.fill();}
    drawE(ctx,hero,pl.x,pl.y,38);
    comicText(ctx,'SCORE '+score,90,24,26);comicText(ctx,'WAVE '+wave,W-70,24,22,'#fff');
    if(flashT>0&&flash) comicText(ctx,flash,W/2,H/2,48,'#FFD93D');
  }
  return {update,render};
}


/* ---------- Sticker Dash (endless runner) ---------- */
function runnerGame(cv,ctx,api){
  const W=800,H=320;cv.width=W;cv.height=H;
  const GROUND=H-48,PS=46,GRAV=2300,JUMP=-820;
  const hero=heroSticker(),flyers=enemyStickers(hero),rocks=['🌵','🌵','🧱','🪨','🌵'];
  const pl={x:110,y:GROUND,vy:0,onGround:true,hold:false};
  let nextAfterHigh=false,obs=[],clouds=[],hills=[],speed=340,dist=0,score=0,spawnIn=1.1,t=0,flash=null,flashT=0,lastMile=0,wasJump=false;
  for(let i=0;i<5;i++) clouds.push({x:Math.random()*W,y:30+Math.random()*90,s:0.4+Math.random()*0.5});
  for(let i=0;i<4;i++) hills.push({x:i*260,h:40+Math.random()*50});
  const jumpPressed=()=>api.keys.has(' ')||api.keys.has('arrowup')||api.keys.has('w')||api.ptr.down;
  function spawn(){
    const r=Math.random(),fast=speed>480;
    if(r<0.62){ // ground obstacle, sometimes a double
      const n=fast&&Math.random()<0.35?2:1,e=pick(rocks);
      for(let i=0;i<n;i++) obs.push({x:W+30+i*38,y:GROUND,e,size:40,hw:14,hh:18,fly:false});
    }else if(r<0.85){ // low flyer: must jump
      obs.push({x:W+30,y:GROUND-14,e:pick(flyers),size:38,hw:15,hh:15,fly:true,bob:Math.random()*6});
    }else{ // high flyer: stay on the ground (jumping into it is a crash)
      obs.push({x:W+30,y:GROUND-92,e:pick(flyers),size:38,hw:15,hh:15,fly:true,bob:Math.random()*6});
    }
    // always leave more time than a full (held) jump, plus extra room around high flyers
    const last=obs[obs.length-1],highNow=last&&last.y<GROUND-60;
    spawnIn=Math.max(1.05,1.55-(speed-340)/760)+Math.random()*0.7+(highNow?0.35:0);
    if(nextAfterHigh){spawnIn+=0.3;nextAfterHigh=false;}
    if(highNow) nextAfterHigh=true;
  }
  function update(dt){
    t+=dt;if(flashT>0) flashT-=dt;
    speed=t<42?340+t*9:Math.min(980,718+(t-42)*2.2); // ramps fast, then keeps creeping up
    dist+=speed*dt;score=Math.floor(dist/40);
    if(score>=lastMile+100){lastMile+=100;flash=`${lastMile}!`;flashT=1;beepA(880,0.12,'triangle',0.07);}
    // jump (hold for a higher jump)
    const jp=jumpPressed();
    if(jp&&!wasJump&&pl.onGround){pl.vy=JUMP;pl.onGround=false;beepA(520,0.06,'square',0.04);}
    wasJump=jp;
    const g=(jp&&pl.vy<0)?GRAV*0.55:GRAV;
    pl.vy+=g*dt;pl.y+=pl.vy*dt;
    if(pl.y>=GROUND){pl.y=GROUND;pl.vy=0;pl.onGround=true;}
    // world
    spawnIn-=dt;if(spawnIn<=0) spawn();
    obs.forEach(o=>o.x-=speed*dt*(o.fly?1.08:1));obs=obs.filter(o=>o.x>-60);
    clouds.forEach(c=>{c.x-=speed*dt*0.15*c.s;if(c.x<-80){c.x=W+60;c.y=30+Math.random()*90;}});
    hills.forEach(h=>{h.x-=speed*dt*0.35;if(h.x<-260){h.x+=4*260;h.h=40+Math.random()*50;}});
    // crash? (forgiving hitboxes)
    const px=pl.x,py=pl.y-PS/2+4;
    for(const o of obs){
      const oy=o.y-o.size/2+(o.fly?Math.sin(t*8+o.bob)*4:0);
      if(Math.abs(px-o.x)<o.hw+14&&Math.abs(py-oy)<o.hh+16){flash='CRASH!';flashT=2;beepA(140,0.4,'sawtooth',0.08);api.end(score);return;}
    }
  }
  function render(){
    const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#5CC8FF');sky.addColorStop(1,'#CDEFFF');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,255,255,0.9)';clouds.forEach(c=>{ctx.beginPath();ctx.ellipse(c.x,c.y,40*c.s+20,14*c.s+8,0,0,7);ctx.fill();});
    ctx.fillStyle='#7BC96F';ctx.strokeStyle='#111';ctx.lineWidth=3;
    hills.forEach(h=>{ctx.beginPath();ctx.moveTo(h.x,GROUND+4);ctx.quadraticCurveTo(h.x+130,GROUND-h.h*2,h.x+260,GROUND+4);ctx.fill();ctx.stroke();});
    ctx.fillStyle='#E8B96A';ctx.fillRect(0,GROUND+4,W,H-GROUND);ctx.fillStyle='#111';ctx.fillRect(0,GROUND+2,W,4);
    ctx.fillStyle='rgba(0,0,0,0.25)';const off=(dist*1)%40;for(let x=-off;x<W;x+=40) ctx.fillRect(x,GROUND+18,14,4);
    obs.forEach(o=>{const oy=o.y-o.size/2+(o.fly?Math.sin(t*8+o.bob)*4:0);drawE(ctx,o.e,o.x,oy,o.size);});
    // shadow + hero (little squash on landing, tilt in the air)
    ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(pl.x,GROUND+4,18*(1-(GROUND-pl.y)/260),4,0,0,7);ctx.fill();
    ctx.save();ctx.translate(pl.x,pl.y-PS/2+4);ctx.rotate(pl.onGround?Math.sin(t*18)*0.08:-0.2);drawE(ctx,hero,0,0,PS);ctx.restore();
    comicText(ctx,'SCORE '+score,110,28,28);
    comicText(ctx,'BEST '+((P.best&&P.best.run)||0),W-90,26,20,'#fff');
    if(flashT>0&&flash) comicText(ctx,flash,W/2,H/2-30,56,'#FFD93D');
  }
  return {update,render,state:()=>({pl,obs,speed,score,GROUND})};
}


/* ---------- Brick Breaker ---------- */
function brickGame(cv,ctx,api){
  const W=800,H=560;cv.width=W;cv.height=H;
  const PW=132,PH=22,PY=H-46,BS=24,COLS=10,BW=70,BH=34,GAP=6,LEFT=(W-(COLS*BW+(COLS-1)*GAP))/2,TOP=78;
  const hero=heroSticker(),pool=enemyStickers(hero);
  const ROWCOL=['#E63946','#FF8C42','#FFD93D','#2BB673','#2F80ED','#8E44AD'];
  const pad={x:W/2-PW/2};
  const ball={x:0,y:0,vx:0,vy:0,spin:0};
  let bricks=[],lives=3,score=0,level=0,mode='serve',serveT=1.1,flash=null,flashT=0,t=0;
  function build(){
    level++;bricks=[];const rows=Math.min(3+level,6),picks=shuffle(pool);
    for(let r=0;r<rows;r++)for(let c=0;c<COLS;c++)
      bricks.push({x:LEFT+c*(BW+GAP),y:TOP+r*(BH+GAP),e:picks[r%picks.length],col:ROWCOL[r%ROWCOL.length],hp:(level>=3&&r===0)?2:1,alive:true});
    if(level>1){flash=`LEVEL ${level}!`;flashT=1.4;}
    serve();
  }
  const speed0=()=>290+(level-1)*35;
  function serve(){mode='serve';serveT=1.1;ball.vx=ball.vy=0;}
  function launch(){const a=(-Math.PI/2)+(Math.random()*0.7-0.35);ball.vx=Math.cos(a)*speed0();ball.vy=Math.sin(a)*speed0();mode='play';}
  build();
  function update(dt){
    t+=dt;if(flashT>0) flashT-=dt;
    const k=api.keys,dk=((k.has('arrowright')||k.has('d'))?1:0)-((k.has('arrowleft')||k.has('a'))?1:0);
    if(dk) pad.x+=dk*620*dt;else if(api.ptr.active){const tgt=api.ptr.x-PW/2,st=1100*dt;pad.x+=Math.max(-st,Math.min(st,tgt-pad.x));}
    pad.x=Math.max(0,Math.min(W-PW,pad.x));
    if(mode==='serve'){ball.x=pad.x+PW/2-BS/2;ball.y=PY-BS-2;serveT-=dt;if(serveT<=0) launch();return;}
    ball.spin+=dt*6;
    const steps=Math.max(1,Math.ceil(Math.hypot(ball.vx,ball.vy)*dt/(BS/3))),sdt=dt/steps;
    for(let i=0;i<steps;i++){
      ball.x+=ball.vx*sdt;ball.y+=ball.vy*sdt;
      if(ball.x<=0){ball.x=0;ball.vx=Math.abs(ball.vx);beepA(300,0.03);}
      if(ball.x+BS>=W){ball.x=W-BS;ball.vx=-Math.abs(ball.vx);beepA(300,0.03);}
      if(ball.y<=0){ball.y=0;ball.vy=Math.abs(ball.vy);beepA(300,0.03);}
      // paddle
      if(ball.vy>0&&ball.y+BS>=PY&&ball.y+BS<=PY+PH+10&&ball.x+BS>pad.x&&ball.x<pad.x+PW){
        const rel=Math.max(-1,Math.min(1,((ball.x+BS/2)-(pad.x+PW/2))/(PW/2))),ang=rel*(Math.PI/3)-Math.PI/2;
        const sp=Math.min(620,Math.hypot(ball.vx,ball.vy)*1.01);ball.vx=Math.cos(ang)*sp;ball.vy=Math.sin(ang)*sp;ball.y=PY-BS;beepA(460,0.05);
      }
      // bricks
      for(const b of bricks){
        if(!b.alive) continue;
        if(ball.x+BS>b.x&&ball.x<b.x+BW&&ball.y+BS>b.y&&ball.y<b.y+BH){
          const ox=Math.min(ball.x+BS-b.x,b.x+BW-ball.x),oy=Math.min(ball.y+BS-b.y,b.y+BH-ball.y);
          if(ox<oy){ball.vx=-ball.vx;ball.x+=ball.vx>0?ox:-ox;}else{ball.vy=-ball.vy;ball.y+=ball.vy>0?oy:-oy;}
          b.hp--;if(b.hp<=0){b.alive=false;score+=10;beepA(520+Math.random()*200,0.06,'square',0.05);}else beepA(250,0.06);
          break;
        }
      }
      if(ball.y>H){lives--;beepA(160,0.35,'triangle',0.1);
        if(lives<=0){mode='over';api.end(score);return;}
        flash=pick(['OOPS!','WHOOSH!','MISSED!']);flashT=0.9;serve();return;}
    }
    if(!bricks.some(b=>b.alive)){score+=100;beepA(990,0.25,'triangle',0.08);build();}
  }
  function render(){
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1D2B53');g.addColorStop(1,'#0B1026');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,255,255,0.05)';for(let x=10;x<W;x+=22)for(let y=10;y<H;y+=22){ctx.beginPath();ctx.arc(x,y,1.5,0,7);ctx.fill();}
    bricks.forEach(b=>{if(!b.alive)return;
      ctx.fillStyle=b.col;ctx.strokeStyle='#111';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect?ctx.roundRect(b.x,b.y,BW,BH,7):ctx.rect(b.x,b.y,BW,BH);ctx.fill();ctx.stroke();
      if(b.hp>1){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(b.x+4,b.y+4,BW-8,BH-8);}
      drawE(ctx,b.e,b.x+BW/2,b.y+BH/2,24);});
    ctx.fillStyle='#E63946';ctx.strokeStyle='#111';ctx.lineWidth=4;ctx.beginPath();ctx.roundRect?ctx.roundRect(pad.x,PY,PW,PH,11):ctx.rect(pad.x,PY,PW,PH);ctx.fill();ctx.stroke();
    for(let i=0;i<3;i++) drawE(ctx,hero,pad.x+PW*(i+0.5)/3,PY+PH/2,20);
    if(mode!=='serve'||Math.floor(serveT*6)%2===0){ctx.save();ctx.translate(ball.x+BS/2,ball.y+BS/2);ctx.rotate(ball.spin);drawE(ctx,'🧇',0,0,BS);ctx.restore();}
    for(let i=0;i<3;i++) drawE(ctx,i<lives?'❤️':'🖤',26+i*30,30,22);
    comicText(ctx,'SCORE '+score,W/2,32,32);
    comicText(ctx,'LEVEL '+level,W-80,30,22,'#fff');
    if(flashT>0&&flash) comicText(ctx,flash,W/2,H/2+40,60,'#FFD93D');
  }
  return {update,render,state:()=>({ball,pad,lives,score,level,bricks,PY,PW})};
}

/* ---------- Memory Match ---------- */
function memoryGame(cv,ctx,api){
  const W=640,H=640;cv.width=W;cv.height=H;
  const COLS=4,ROWS=4,PAIRS=8,CW=132,CH=124,GX=16,LEFT=(W-(COLS*CW+(COLS-1)*GX))/2,TOP=84;
  const hero=heroSticker();
  let faces=shuffle([hero,...enemyStickers(hero)]).filter((x,i,a)=>a.indexOf(x)===i);
  ['🦸','🚀','🦖','🐙','🌋','🛸','🤖','🧠','⚡','🐉'].forEach(x=>{if(!faces.includes(x)) faces.push(x);});
  faces=faces.slice(0,PAIRS);
  const cards=shuffle([...faces,...faces]).map((e,i)=>({e,r:Math.floor(i/COLS),c:i%COLS,up:false,done:false,flip:0}));
  let open=[],flips=0,matches=0,lock=0,wasDown=false,t=0,flash=null,flashT=0,streak=0;
  const pos=cd=>({x:LEFT+cd.c*(CW+GX),y:TOP+cd.r*(CH+GX)});
  const scoreNow=()=>Math.max(10,200-5*Math.max(0,flips-PAIRS*2));
  // keyboard: arrows move a cursor, space/enter flips
  let cur=0;const kprev=new Set();
  function tryFlip(cd){
    if(!cd||cd.up||cd.done||lock>0||open.length>=2) return;
    cd.up=true;open.push(cd);flips++;beepA(500,0.04,'square',0.04);
    if(open.length===2){
      if(open[0].e===open[1].e){open.forEach(o=>o.done=true);matches++;streak++;open=[];beepA(880,0.15,'triangle',0.08);
        flash=streak>1?`${streak} IN A ROW!`:pick(['MATCH!','POW!','ZAP!']);flashT=0.8;
        if(matches===PAIRS){flash='ALL MATCHED!';flashT=3;setTimeout(()=>{if(api.running) api.end(scoreNow());},700);}}
      else{lock=0.9;streak=0;}
    }
  }
  function update(dt){
    t+=dt;if(flashT>0) flashT-=dt;
    if(lock>0){lock-=dt;if(lock<=0){open.forEach(o=>o.up=false);open=[];}}
    cards.forEach(cd=>{const tg=(cd.up||cd.done)?1:0;cd.flip+=(tg-cd.flip)*Math.min(1,dt*14);});
    while(api.taps.length){const p=api.taps.shift();tryFlip(cards.find(cd=>{const q=pos(cd);return p.x>=q.x&&p.x<=q.x+CW&&p.y>=q.y&&p.y<=q.y+CH;}));}
    const k=api.keys,press=key=>k.has(key)&&!kprev.has(key);
    if(press('arrowright'))cur=Math.min(cards.length-1,cur+1);if(press('arrowleft'))cur=Math.max(0,cur-1);
    if(press('arrowdown'))cur=Math.min(cards.length-1,cur+COLS);if(press('arrowup'))cur=Math.max(0,cur-COLS);
    if(press(' ')||press('enter')) tryFlip(cards[cur]);
    kprev.clear();k.forEach(x=>kprev.add(x));
  }
  function render(){
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2F80ED');g.addColorStop(1,'#8E44AD');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,255,255,0.08)';for(let x=10;x<W;x+=22)for(let y=10;y<H;y+=22){ctx.beginPath();ctx.arc(x,y,1.6,0,7);ctx.fill();}
    cards.forEach((cd,i)=>{
      const q=pos(cd),f=cd.flip,sx=Math.abs(Math.cos(f*Math.PI)),showFace=f>0.5;
      ctx.save();ctx.translate(q.x+CW/2,q.y+CH/2);ctx.scale(Math.max(0.04,sx),1);
      ctx.fillStyle=showFace?(cd.done?'#C9F7C6':'#FFF8E1'):'#FFD93D';ctx.strokeStyle='#111';ctx.lineWidth=5;
      ctx.beginPath();ctx.roundRect?ctx.roundRect(-CW/2,-CH/2,CW,CH,14):ctx.rect(-CW/2,-CH/2,CW,CH);ctx.fill();ctx.stroke();
      if(showFace) drawE(ctx,cd.e,0,0,64);
      else{ctx.clip();ctx.fillStyle='rgba(230,57,70,0.25)';for(let a=0;a<12;a++){ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,90,a*Math.PI/6,a*Math.PI/6+Math.PI/12);ctx.fill();}
        comicText(ctx,'?',0,4,58,'#fff');}
      ctx.restore();
      if(i===cur&&api.keys.size){ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.setLineDash([8,6]);ctx.strokeRect(q.x-6,q.y-6,CW+12,CH+12);ctx.setLineDash([]);}
    });
    comicText(ctx,`MATCHES ${matches}/${PAIRS}`,150,40,30);
    comicText(ctx,`FLIPS ${flips}`,W-110,40,30,'#fff');
    if(flashT>0&&flash) comicText(ctx,flash,W/2,H/2,58,'#FFD93D');
  }
  return {update,render,state:()=>({cards,flips,matches,pos:cards.map(pos),CW,CH,score:scoreNow()})};
}


/* ---------- Number Catcher (FREE math game) ---------- */
function catcherGame(cv,ctx,api){
  const W=480,H=640;cv.width=W;cv.height=H;
  const hero=heroSticker(),BY=H-96,BW=96;
  const bk={x:W/2};
  let pendingNext=0,drops=[],slot=null,target=10,made=0,strikes=0,score=0,streak=0,spawnIn=0.4,t=0,flash=null,flashT=0,flashCol='#FFD93D',level=1,pairsThisTarget=0,facts=[];
  const TARGETS=[10,10,8,9,10,7,12,10,11,6,13,14,15,10,16,18,20];
  function nextTarget(){level++;pairsThisTarget=0;target=TARGETS[Math.min(level-1,TARGETS.length-1)]+(level>TARGETS.length?rnd(5):0);
    flash=`NOW MAKE ${target}!`;flashT=1.8;flashCol='#5CE1E6';beepA(990,0.2,'triangle',0.08);if(P.autoread) speak(`Now make ${target}!`);}
  function spawn(){
    // when the basket holds a number, make its partner show up often
    if(drops.length>=3){spawnIn=0.3;return;}
    let n;
    if(slot!==null&&Math.random()<0.55) n=target-slot;
    else n=1+rnd(target-1);
    const fall=60+level*6+Math.random()*25;
    // keep new numbers away from the last one so he has room to dodge
    let x,tries=0;const lastX=drops.length?drops[drops.length-1].x:-999;
    do{x=40+Math.random()*(W-80);}while(Math.abs(x-lastX)<130&&tries++<20);
    drops.push({x,y:-30,n,vy:fall,wob:Math.random()*6});
    spawnIn=Math.max(1.0,1.6-level*0.05)+Math.random()*0.45;
  }
  function catchNum(n){
    if(slot===null){slot=n;beepA(600,0.06,'square',0.05);return;}
    if(slot+n===target){
      made++;pairsThisTarget++;P.cstat.made++;streak++;const pts=10+Math.min(streak-1,5)*2;score+=pts;
      facts.push(`${slot}+${n}`);flash=`${slot} + ${n} = ${target}!`;flashT=1.2;flashCol='#FFD93D';slot=null;beepA(880,0.18,'triangle',0.09);
      if(pairsThisTarget>=5) pendingNext=0.9;
    }else{
      strikes++;streak=0;P.cstat.miss++;flash=`${slot} + ${n} = ${slot+n}… not ${target}!`;flashT=1.6;flashCol='#FF8C42';slot=null;beepA(160,0.35,'triangle',0.1);
      if(strikes>=3){api.end(score,`You made <b>${made}</b> number pair${made===1?'':'s'}! ${made?'Nice math!':''}`);}
    }
  }
  function update(dt){
    t+=dt;if(flashT>0) flashT-=dt;
    if(pendingNext>0){pendingNext-=dt;if(pendingNext<=0) nextTarget();}
    const k=api.keys,dk=((k.has('arrowright')||k.has('d'))?1:0)-((k.has('arrowleft')||k.has('a'))?1:0);
    if(dk) bk.x+=dk*380*dt;else if(api.ptr.active){const st=700*dt;bk.x+=Math.max(-st,Math.min(st,api.ptr.x-bk.x));}
    bk.x=Math.max(BW/2,Math.min(W-BW/2,bk.x));
    spawnIn-=dt;if(spawnIn<=0) spawn();
    for(const d of drops){
      d.y+=d.vy*dt;
      if(!d.gone&&d.y>BY-20&&d.y<BY+12&&Math.abs(d.x-bk.x)<BW/2+6){d.gone=true;catchNum(d.n);if(!api.running) return;}
    }
    drops=drops.filter(d=>!d.gone&&d.y<H+40);
  }
  function bubble(x,y,n,hi){
    ctx.fillStyle=hi?'#FFD93D':'#fff';ctx.strokeStyle='#111';ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,y,26,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='#111';ctx.font='34px Bangers, Impact, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n,x,y+2);
  }
  function render(){
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2BB673');g.addColorStop(1,'#0E6B3A');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,255,255,0.08)';for(let x=10;x<W;x+=22)for(let y=10;y<H;y+=22){ctx.beginPath();ctx.arc(x,y,1.6,0,7);ctx.fill();}
    // target banner
    ctx.fillStyle='#E63946';ctx.strokeStyle='#111';ctx.lineWidth=4;ctx.beginPath();ctx.roundRect?ctx.roundRect(W/2-100,14,200,52,12):ctx.rect(W/2-100,14,200,52);ctx.fill();ctx.stroke();
    comicText(ctx,`MAKE ${target}!`,W/2,42,38,'#fff');
    // equation helper
    const eq=slot===null?`? + ? = ${target}`:`${slot} + ? = ${target}`;
    comicText(ctx,eq,W/2,96,32,slot===null?'#fff':'#FFD93D');
    drops.forEach(d=>bubble(d.x+Math.sin(t*3+d.wob)*6,d.y,d.n,slot!==null&&slot+d.n===target&&level<=2));
    // basket with hero
    ctx.fillStyle='#8B5A2B';ctx.strokeStyle='#111';ctx.lineWidth=4;ctx.beginPath();
    ctx.moveTo(bk.x-BW/2,BY);ctx.lineTo(bk.x+BW/2,BY);ctx.lineTo(bk.x+BW/2-12,BY+40);ctx.lineTo(bk.x-BW/2+12,BY+40);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.strokeStyle='#D9A35F';ctx.lineWidth=3;for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(bk.x-BW/2+6+i*3,BY+i*10);ctx.lineTo(bk.x+BW/2-6-i*3,BY+i*10);ctx.stroke();}
    drawE(ctx,hero,bk.x,BY+62,32);
    if(slot!==null) bubble(bk.x,BY-4,slot,true);
    for(let i=0;i<3;i++) drawE(ctx,i<3-strikes?'❤️':'🖤',26+i*30,34,22);
    comicText(ctx,'SCORE '+score,W-62,40,20,'#fff');
    if(flashT>0&&flash) comicText(ctx,flash,W/2,H/2,flash.length>14?34:52,flashCol);
  }
  return {update,render,state:()=>({drops,slot,target,made,strikes,score,bk,BY,level})};
}

function vault(){
  app.innerHTML=`<section class="panel">
    <h2 style="font-size:34px">🏆 STICKER VAULT</h2>
    <p>You have <b>${P.stickers.length}</b> of ${STICKERS.length} stickers. Finish a mission to win a new one! Your stickers become players in the 🕹️ Arcade.</p>
    <div class="vault">${STICKERS.map(s=>P.stickers.includes(s)?`<div class="slot">${s}</div>`:'<div class="slot locked">?</div>').join('')}</div>
  </section>
  <button class="btn big red" onclick="go('map')">🚀 WIN MORE STICKERS!</button>`;
}
function grown(){
  const pct=f=>f&&f[1]?Math.round(100*f[0]/f[1])+'%':'—';
  const rows=Object.keys(TYPES).map(t=>{const w=WORLDS.find(w=>w.types.includes(t));
    return `<tr><td>${TYPES[t].bat}</td><td>${TYPES[t].real}</td><td>${TYPES[t].icon} ${TYPES[t].name}<br><span class="note">${w.name}</span></td><td>${TYPES[t].learn}</td></tr>`;}).join('');
  const prog=Object.keys(TYPES).map(t=>{const f=P.first[t]||[0,0],h=P.firstH[t]||[0,0];
    return `<tr><td>${TYPES[t].real}</td><td>${f[1]}</td><td>${pct(f)}</td><td>${P.aced[t]?'✅ '+P.aced[t]+'×':'—'}</td><td>${h[1]}</td><td>${pct(h)}</td><td>${P.gold[t]?'⭐ '+P.gold[t]+'×':'—'}</td></tr>`;}).join('');
  app.innerHTML=`<section class="panel grown">
    <h2>🧑 GROWN-UP CORNER</h2>
    <p>Brain Blasters gives your child short, playful practice with the <b>9 question types on the CogAT Level 8</b>, the level commonly used in 2nd grade. It’s meant to make the formats familiar — it is <b>not</b> an official practice test and doesn’t predict a score. Check with your district which test and level it uses.</p>
    <h3>What’s inside</h3>
    <table class="tbl"><tr><th>Battery</th><th>CogAT type</th><th>Mission</th><th>Practices</th></tr>${rows}</table>
    <p class="note">Number and shape puzzles are freshly generated every time. Word puzzles rotate through a hand-written set.</p>
    <h3>⚡ Challenge Mode &amp; the Arcade</h3>
    <ul>
      <li><b>Challenge Mode</b> (switch at the top of the mission map) uses harder versions of all 9 types, closer to 3rd-grade (Level 9) style: written-word analogies, fill-in-the-blank sentences, odd-one-out, two-step number rules, numeral patterns, picture-algebra, 3×3 grids, side-counting, and slanted or reverse paper folds.</li>
      <li>A <b>Surprise Challenge</b> leans toward number and paper-folding puzzles, his growth areas.</li>
      <li>Finishing a Challenge mission earns <b>1 Arcade token</b>, and acing it earns <b>2</b> plus a gold ★. <b>Bonus missions earn double</b> (2, or 4 if aced). Bonus missions are the 4 types where his first-try rate is lowest, so the list follows his growth areas automatically and changes as he improves. They’re marked 🎟️×2 on the Challenge map. Surprise Challenges also earn double, since they lean toward number and paper-folding puzzles. Regular missions don’t earn tokens.</li>
      <li><b>Right now the bonus missions are:</b> ${bonusTypes().map(t=>TYPES[t].icon+' '+TYPES[t].name+' ('+TYPES[t].real+')').join(', ')}.</li>
      <li><b>🧺 Number Catcher</b> is free and never costs a token, so it’s always worth playing. He catches two falling numbers that add up to a target, starting with “make 10,” then moving to 8, 9, 12 and eventually up to 20 after every 5 correct pairs. On the first two targets the matching partner glows to help him learn. A wrong pair counts as a strike, and 3 strikes ends the game. It has a button on the home screen and on Number Mountain, and it stays available even when the Arcade is off.</li>
      <li>You can turn the Arcade off and set how many tokens a game costs (2 by default) in Settings below. The games are <b>Sticker Pong</b> (ends after 3 misses against the computer) <b>Sticker Invaders</b> (ends when the invaders reach him), <b>Sticker Dash</b>, an endless runner like the offline dino game (ends at the first crash), <b>Sticker Smash</b>, a brick breaker (ends after 3 missed balls), or <b>Sticker Match</b>, a memory card game (ends when all 8 pairs are found; fewer flips scores higher). Games usually last a few minutes, so the puzzles stay the main event.</li>
    </ul>
    <h3>How to use it</h3>
    <ul>
      <li><b>One mission per sitting.</b> 5 puzzles is about 5–10 minutes. Stop while it’s still fun.</li>
      <li><b>Let him choose the world.</b> Picking the mission keeps him invested.</li>
      <li><b>Turn on Auto-read below.</b> At 2nd grade the CogAT is mostly pictures, with directions read aloud. Confirm this with your school.</li>
      <li><b>No timer, no failing.</b> A wrong answer just grays out and he tries again. A hint appears after the second miss, and every answer comes with a short “why.”</li>
      <li><b>Ask “How’d you crack it?”</b> Explaining his thinking is the real skill. For analogies, teach the sentence trick: “A dog <i>eats</i> a bone… a rabbit <i>eats</i> a ___.”</li>
      <li><b>Use the Bonus Challenge.</b> Inventing a puzzle (with LEGO or a drawing) for you to solve builds the same reasoning, and it suits a builder.</li>
      <li><b>Keep it light.</b> A few short sessions a week is plenty. The goal is that nothing looks unfamiliar on test day. Drilling for a high score can place a child where the pace doesn’t fit.</li>
    </ul>
    <h3>Settings</h3>
    <div class="toggle"><span>🔊 Auto-read each question aloud</span><button class="sw ${P.autoread?'on':''}" aria-label="Auto-read" onclick="P.autoread=!P.autoread;save();grown()"></button></div>
    <div class="toggle"><span>🕹️ Arcade games<br><span class="note">When off, the Arcade is hidden. Tokens he earns are saved for when it's back on.</span></span><button class="sw ${P.arcadeOn?'on':''}" aria-label="Arcade games" onclick="P.arcadeOn=!P.arcadeOn;save();grown()"></button></div>
    <div class="toggle"><span>🎟️ Tokens per Arcade game<br><span class="note">Number Catcher is always free.</span></span><span class="row" style="gap:6px;flex-wrap:nowrap">${[1,2,3].map(n=>`<button class="costbtn ${gameCost()===n?'on':''}" onclick="P.cost=${n};save();grown()">${n}</button>`).join('')}</span></div>
    <div class="toggle"><span>🧺 Number Catcher (free math game)<br><span class="note">Always free, even when the Arcade is off. Turn it off to hide it.</span></span><button class="sw ${P.catchOn?'on':''}" aria-label="Number Catcher" onclick="P.catchOn=!P.catchOn;save();grown()"></button></div>
    <div class="toggle"><span>🔔 Sound effects</span><button class="sw ${P.sound?'on':''}" aria-label="Sound" onclick="toggleSound();grown()"></button></div>
    <h3>Progress <span class="note">(saved on this device only)</span></h3>
    <p>Missions finished: <b>${P.total}</b> · Stickers: <b>${P.stickers.length}</b> · Arcade tokens: <b>${P.tokens||0}</b> · Best Pong: <b>${(P.best&&P.best.pong)||0}</b> · Best Invaders: <b>${(P.best&&P.best.inv)||0}</b> · Best Dash: <b>${(P.best&&P.best.run)||0}</b> · Best Smash: <b>${(P.best&&P.best.brick)||0}</b> · Best Match: <b>${(P.best&&P.best.mem)||0}</b></p>
    <p>🧺 Number Catcher: <b>${(P.cstat&&P.cstat.made)||0}</b> correct number pairs, <b>${(P.cstat&&P.cstat.miss)||0}</b> wrong pairs · Best score: <b>${(P.best&&P.best.catch)||0}</b></p>
    <div style="overflow-x:auto"><table class="tbl"><tr><th>Type</th><th>Solved</th><th>1st try</th><th>Aced</th><th>⚡ Solved</th><th>⚡ 1st try</th><th>⚡ Gold</th></tr>${prog}</table></div>
    <p class="note">Use this to see which formats feel new to him, not as a grade. Low first-try numbers usually just mean the format is unfamiliar.</p>
    <div style="margin-top:12px"><button class="btn small" style="background:#fff" onclick="askReset()">Reset all progress</button></div>
  </section>
  <button class="btn big red" onclick="go('home')">⬅ BACK TO THE COMIC</button>`;
}
function askReset(){
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="panel center"><h3 style="font-size:26px">Erase all progress?</h3><p>Stickers, ranks, tokens and stats will be wiped on this device.</p>
  <div class="row" style="justify-content:center"><button class="btn small red" id="yesR">Yes, reset</button><button class="btn small" style="background:#fff" id="noR">Cancel</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('#noR').onclick=()=>m.remove();
  m.querySelector('#yesR').onclick=()=>{Object.assign(P,{missions:{},first:{},stickers:[],total:0,aced:{},missionsH:{},firstH:{},gold:{},tokens:0,best:{},hero:null,challenge:false,cstat:{made:0,miss:0}});save();m.remove();grown();};
}

updSnd();home();
</script>
</body>
</html>
