<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain Blasters! Comic Puzzle Missions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#111; --paper:#fff; --yellow:#FFD93D; --red:#E63946; --blue:#2F80ED;
  --green:#2BB673; --purple:#8E44AD; --orange:#FF8C42;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Comic Neue','Comic Sans MS','Chalkboard SE',cursive,sans-serif;
  font-weight:700; color:var(--ink); min-height:100vh;
  background-color:#FFE45C;
  background-image:radial-gradient(#F5C400 1.6px, transparent 1.8px);
  background-size:14px 14px;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;color:inherit;cursor:pointer}
h1,h2,h3,.bang{font-family:'Bangers','Impact',sans-serif;font-weight:400;letter-spacing:1.5px;margin:0}
header{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;background:var(--red);border-bottom:4px solid var(--ink);
}
.logo{
  font-family:'Bangers',Impact,sans-serif;font-size:26px;letter-spacing:2px;color:#fff;background:none;border:none;
  text-shadow:2px 2px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink);padding:0;
}
.hbtns{display:flex;gap:8px}
.icon-btn{background:#fff;border:3px solid var(--ink);border-radius:10px;font-size:18px;padding:4px 9px;box-shadow:2px 2px 0 var(--ink)}
main{max-width:720px;margin:0 auto;padding:14px 12px 60px}
.panel{background:var(--paper);border:4px solid var(--ink);border-radius:6px;box-shadow:6px 6px 0 var(--ink);padding:14px;margin-bottom:18px;position:relative}
.btn{
  font-family:'Bangers',Impact,sans-serif;font-size:24px;letter-spacing:1.5px;
  background:var(--yellow);border:4px solid var(--ink);border-radius:10px;box-shadow:4px 4px 0 var(--ink);
  padding:10px 18px;transition:transform .08s, box-shadow .08s;
}
.btn:active,.mbtn:active,.opt:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.red{background:var(--red);color:#fff;text-shadow:1px 1px 0 var(--ink)}
.btn.blue{background:var(--blue);color:#fff;text-shadow:1px 1px 0 var(--ink)}
.btn.green{background:var(--green);color:#fff;text-shadow:1px 1px 0 var(--ink)}
.btn.big{font-size:30px;width:100%;padding:14px}
.btn.small{font-size:19px;padding:6px 12px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.center{text-align:center}

/* speech bubbles */
.bubble{
  position:relative;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 14px;font-size:17px;line-height:1.3;
}
.bubble.left::before{content:"";position:absolute;left:-14px;top:18px;border:8px solid transparent;border-right:12px solid var(--ink)}
.bubble.left::after{content:"";position:absolute;left:-9px;top:20px;border:6px solid transparent;border-right:9px solid #fff}
.bubble.down::before{content:"";position:absolute;left:28px;bottom:-16px;border:8px solid transparent;border-top:13px solid var(--ink)}
.bubble.down::after{content:"";position:absolute;left:30px;bottom:-10px;border:6px solid transparent;border-top:10px solid #fff}

/* cover */
.cover{background:var(--blue);color:#fff;text-align:center;overflow:hidden;padding:16px 12px 8px}
.cover::before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 60%, rgba(255,255,255,.13) 0 10deg, transparent 10deg 20deg);pointer-events:none}
.issue{position:absolute;top:8px;left:10px;background:#fff;color:var(--ink);border:3px solid var(--ink);font-family:Bangers,Impact,sans-serif;font-size:15px;padding:2px 8px;transform:rotate(-5deg);z-index:2}
.price{position:absolute;top:8px;right:10px;background:var(--yellow);color:var(--ink);border:3px solid var(--ink);border-radius:50%;width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-family:Bangers,Impact,sans-serif;font-size:13px;line-height:1;transform:rotate(8deg);z-index:2;text-align:center}
.title{font-size:56px;line-height:.95;color:var(--yellow);text-shadow:4px 4px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);margin-top:26px;position:relative;transform:rotate(-2deg)}
.subtitle{font-family:Bangers,Impact,sans-serif;font-size:22px;letter-spacing:1.5px;margin:6px 0 4px;position:relative;text-shadow:2px 2px 0 var(--ink)}
.heroes{display:flex;justify-content:center;align-items:flex-end;gap:6px;position:relative;margin-top:6px}
.heroes svg{height:150px;width:auto}
.rank{display:inline-block;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:20px;padding:3px 12px;font-size:15px;margin:6px 0 4px;position:relative}

/* comic strip */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px}
.strip .cpanel{border:3px solid var(--ink);border-radius:4px;padding:6px;background:#FFF8E1;display:flex;flex-direction:column;justify-content:space-between;min-height:170px}
.strip .cpanel:nth-child(2){background:#E3F2FD}
.strip .cpanel:nth-child(3){background:#FCE4EC}
.strip .say{font-size:13px;line-height:1.2;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:5px 6px}
.strip svg{height:80px;width:auto;align-self:center}
.caption{background:var(--yellow);border:2px solid var(--ink);font-size:11px;padding:2px 5px;align-self:flex-start;margin-bottom:4px}

/* map */
.maphead{display:flex;gap:10px;align-items:center}
.maphead svg{height:84px;width:auto;flex:none}
.world{border-color:var(--ink);padding-top:10px}
.world h2{font-size:30px;color:#fff;background:var(--wc);margin:-10px -14px 8px;padding:6px 14px;border-bottom:4px solid var(--ink);text-shadow:2px 2px 0 var(--ink)}
.wblurb{margin:0 0 10px;font-size:15px}
.mlist{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mbtn{background:#fff;border:3px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--ink);padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px}
.micon{font-size:34px}
.mname{font-family:Bangers,Impact,sans-serif;font-size:17px;letter-spacing:1px;line-height:1.05;text-align:center}
.mcount{font-size:11px;min-height:14px}
.newtag{background:var(--red);color:#fff;border-radius:6px;padding:1px 5px;font-size:11px}

/* question */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.mini{background:#fff;border:3px solid var(--ink);border-radius:10px;box-shadow:2px 2px 0 var(--ink);font-size:15px;padding:5px 10px;font-weight:700;white-space:nowrap}
.dots{display:flex;gap:6px}
.dot{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);background:#fff}
.dot.done{background:var(--green)}
.dot.now{background:var(--yellow);transform:scale(1.25)}
.qtype{position:absolute;top:-16px;left:12px;background:var(--yellow);border:3px solid var(--ink);font-family:Bangers,Impact,sans-serif;font-size:17px;letter-spacing:1px;padding:1px 10px;transform:rotate(-2deg)}
.qtext{font-size:19px;line-height:1.3;margin:10px 0 12px}
.qvis{display:flex;justify-content:center}
.helper{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.helper .av svg{height:66px;width:auto}
.helper .bubble{flex:1;font-size:16px;min-height:48px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{position:relative;background:#fff;border:4px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink);min-height:118px;padding:16px 8px 10px;display:flex;align-items:center;justify-content:center;transition:transform .08s}
.letter{position:absolute;top:-12px;left:-10px;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;border:3px solid var(--ink);font-family:Bangers,Impact,sans-serif;font-size:17px;display:flex;align-items:center;justify-content:center}
.opt.right{background:#C9F7C6;border-color:#0E7A35;animation:pop .35s}
.opt.right .letter{background:var(--green)}
.opt.wrong{opacity:.35;filter:grayscale(1);animation:shake .35s}
.opt:disabled{cursor:default}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.nextwrap{margin-top:16px}
.pow{position:fixed;z-index:50;pointer-events:none;font-family:Bangers,Impact,sans-serif;font-size:40px;color:var(--yellow);
  text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);
  transform:translate(-50%,-50%) scale(.3) rotate(-10deg);animation:powA .9s forwards}
.pow::before{content:"";position:absolute;inset:-26px -30px;z-index:-1;background:var(--red);
  clip-path:polygon(50% 0,61% 30%,95% 12%,72% 42%,100% 55%,68% 62%,82% 95%,52% 72%,30% 100%,32% 68%,0 78%,22% 52%,2% 25%,35% 32%);}
@keyframes powA{0%{transform:translate(-50%,-50%) scale(.3) rotate(-10deg);opacity:1}40%{transform:translate(-50%,-90%) scale(1.15) rotate(-6deg)}80%{opacity:1}100%{transform:translate(-50%,-110%) scale(1) rotate(-6deg);opacity:0}}

/* visuals */
.emo{font-size:50px;line-height:1;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;font-weight:400}
.tile{width:84px;height:84px;border:3px solid var(--ink);border-radius:10px;background:#FFF8E1;display:flex;align-items:center;justify-content:center}
.tile.q,.cell.q{background:#E3F2FD;font-family:Bangers,Impact,sans-serif;font-size:44px;color:var(--blue)}
.tile .emo{font-size:48px}
.arrow{font-size:30px;font-weight:700;padding:0 4px}
.analogy{display:flex;flex-direction:column;gap:12px;align-items:center}
.pair{display:flex;align-items:center;gap:6px}
.pairs-wrap{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}
.sep{font-family:Bangers,Impact,sans-serif;font-size:26px;color:#888}
.riddle{font-size:22px;line-height:1.3;text-align:center;background:#FFF8E1;border:3px dashed var(--ink);border-radius:12px;padding:14px}
.club{border:3px solid var(--ink);border-radius:12px;background:#FFF8E1;padding:10px 10px 12px;text-align:center}
.clublabel{font-family:Bangers,Impact,sans-serif;letter-spacing:1px;font-size:17px;margin-bottom:6px}
.row3{display:flex;gap:10px;justify-content:center}
.cell{width:88px;height:88px;border:3px solid var(--ink);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;padding:6px}
.cell svg.fig{width:100%;height:100%}
.opt svg.fig{width:100%;max-width:130px;height:84px}
.grp{display:grid;grid-template-columns:repeat(5,auto);gap:1px 2px;justify-content:center;font-size:19px;line-height:1.15;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;font-weight:400}
.opt .grp{font-size:20px}
.machine{display:flex;flex-direction:column;gap:8px;width:100%;max-width:400px}
.mrow{display:grid;grid-template-columns:1fr 54px 1fr;align-items:center;gap:6px}
.mbox{border:3px solid var(--ink);border-radius:10px;background:#FFF8E1;min-height:64px;display:flex;align-items:center;justify-content:center;padding:6px}
.mrow:last-child .mbox:last-child{background:#E3F2FD}
.gear{font-size:22px;text-align:center}
.qbig{font-family:Bangers,Impact,sans-serif;font-size:38px;color:var(--blue)}
.eq{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;font-family:Bangers}
.nt{min-width:52px;height:58px;border:3px solid var(--ink);border-radius:10px;background:#FFF8E1;display:flex;align-items:center;justify-content:center;font-size:36px;padding:0 6px}
.nt.q{background:#E3F2FD;color:var(--blue)}
.op{font-size:36px}
.eqside{display:flex;align-items:center;gap:6px}
.bigeq{font-size:44px;padding:0 4px;color:var(--red)}
.optnum{font-family:Bangers,Impact,sans-serif;font-size:48px}
.balance{display:flex;flex-direction:column;gap:8px;align-items:stretch;width:100%;max-width:420px}
.brow{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px;align-items:center}
.blabel{font-family:Bangers,Impact,sans-serif;font-size:16px;width:56px}
.bplus{font-family:Bangers,Impact,sans-serif;font-size:28px}
.abacus{height:170px;width:auto;max-width:100%}
.opt .abacus{height:100px}
.matrix{display:grid;grid-template-columns:auto auto auto;gap:8px;align-items:center;justify-items:center}
.marrow{font-size:26px}
.pfsteps{display:flex;gap:8px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.pfstep{display:flex;flex-direction:column;align-items:center;gap:4px}
.pflabel{font-family:Bangers,Impact,sans-serif;font-size:15px;letter-spacing:1px;background:var(--yellow);border:2px solid var(--ink);padding:0 6px}
.pfstep svg{width:100px;height:100px;background:#fff;border:3px solid var(--ink);border-radius:8px}
.opt svg.paper{width:92px;height:92px}

/* complete */
.burstbig{display:inline-block;font-family:Bangers,Impact,sans-serif;font-size:38px;color:#fff;background:var(--red);padding:16px 26px;border:4px solid var(--ink);transform:rotate(-3deg);text-shadow:2px 2px 0 var(--ink);box-shadow:5px 5px 0 var(--ink);margin:6px 0 12px}
.newsticker{font-size:76px;display:inline-block;animation:spin 1s ease-out;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
@keyframes spin{from{transform:scale(.2) rotate(-180deg)}to{transform:scale(1) rotate(0)}}
.brk{background:#E3F2FD;text-align:left}
.brk h3{font-size:26px;color:var(--blue)}
.brk p{font-size:20px;margin:6px 0 0}
.bonus{background:#FCE4EC;text-align:left;font-size:16px}
.zaps{font-size:18px}

/* checklist */
.checklist h2{font-size:28px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ccount{font-size:18px;background:var(--green);color:#fff;border:3px solid var(--ink);border-radius:20px;padding:2px 12px;text-shadow:1px 1px 0 var(--ink)}
.checklist>.note{margin:4px 0 0}
.cworld{margin-top:12px}
.cwname{font-family:Bangers,Impact,sans-serif;font-size:19px;letter-spacing:1px;color:#fff;text-shadow:1px 1px 0 var(--ink);background:var(--wc);border:3px solid var(--ink);border-bottom:none;border-radius:8px 8px 0 0;padding:2px 12px;display:inline-block}
.citem{display:flex;align-items:center;gap:10px;width:100%;background:#fff;border:3px solid var(--ink);margin-top:-3px;padding:8px 10px;text-align:left;font-size:17px;font-weight:700;border-radius:0}
.cworld .cwname+.citem{border-top-right-radius:8px}
.cworld .citem:last-child{border-radius:0 0 8px 8px}
.cbox{width:30px;height:30px;flex:none;border:3px solid var(--ink);border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;font-weight:900;text-shadow:1px 1px 0 var(--ink)}
.cname{flex:1}
.cstat{font-family:Bangers,Impact,sans-serif;letter-spacing:1px;font-size:15px;padding:1px 8px;border:2px solid var(--ink);border-radius:12px;background:#eee;white-space:nowrap}
.citem.aced{background:#D7F8D4}
.citem.aced .cbox{background:var(--green)}
.citem.aced .cstat{background:var(--yellow);transform:rotate(-5deg)}
.citem.played .cstat{background:#FFF1B8}
.allaced{margin-top:12px;text-align:center;font-family:Bangers,Impact,sans-serif;font-size:24px;letter-spacing:1px;background:var(--yellow);border:3px solid var(--ink);border-radius:10px;padding:6px}
.acestamp{display:inline-block;font-family:Bangers,Impact,sans-serif;font-size:36px;letter-spacing:2px;color:var(--green);border:5px solid var(--green);border-radius:10px;padding:0 16px;transform:rotate(-8deg);margin:8px 0 4px;background:#fff;animation:stamp .5s ease-out}
@keyframes stamp{from{transform:scale(2.2) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}
.mbtn.aced{background:#D7F8D4}
.acetag{background:var(--green);color:#fff;border-radius:6px;padding:1px 6px;font-size:11px;border:2px solid var(--ink)}

/* vault */
.vault{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.slot{aspect-ratio:1;border:3px solid var(--ink);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:34px;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.slot.locked{background:#ddd;color:#999;font-family:Bangers,Impact,sans-serif;font-size:28px}

/* grown-ups */
.grown{font-weight:400;font-size:16px;line-height:1.5}
.grown h2{font-size:30px;margin-bottom:6px}
.grown h3{font-size:22px;margin:14px 0 4px;color:var(--blue)}
.grown b{font-weight:700}
.grown ul{padding-left:20px;margin:6px 0}
.grown li{margin-bottom:6px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.tbl th,.tbl td{border:2px solid var(--ink);padding:5px 6px;text-align:left;vertical-align:top}
.tbl th{background:var(--yellow);font-family:Bangers,Impact,sans-serif;font-weight:400;letter-spacing:1px;font-size:15px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:2px dashed #ccc}
.sw{width:58px;height:32px;border-radius:20px;border:3px solid var(--ink);background:#ccc;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:left .15s}
.sw.on{background:var(--green)}
.sw.on::after{left:27px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal .panel{max-width:360px}
.note{font-size:13px;color:#444}
.intro .bubble{font-size:18px}
.intro svg{height:110px;width:auto}

@media (max-width:420px){
  .title{font-size:46px}
  .tile{width:70px;height:70px}.tile .emo{font-size:40px}
  .cell{width:76px;height:76px}
  .strip .say{font-size:12px}
  .mname{font-size:15px}
  .opt{min-height:108px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <button class="logo" onclick="go('home')" aria-label="Home">BRAIN BLASTERS!</button>
  <div class="hbtns">
    <button class="icon-btn" id="sndBtn" onclick="toggleSound()" aria-label="Sound on or off">🔔</button>
    <button class="icon-btn" onclick="go('home')" aria-label="Home">🏠</button>
  </div>
</header>
<main id="app"></main>

<script>
/* =========================================================
   ORIGINAL CHARACTERS: Captain Waffle & Gizmo the robot
   ========================================================= */
const WAFFLE = `<svg viewBox="0 0 124 156" xmlns="http://www.w3.org/2000/svg" aria-label="Captain Waffle">
 <path d="M30 42 Q6 112 16 146 L108 146 Q118 112 94 42 Z" fill="#E63946" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
 <line x1="46" y1="118" x2="42" y2="142" stroke="#111" stroke-width="6" stroke-linecap="round"/>
 <line x1="78" y1="118" x2="82" y2="142" stroke="#111" stroke-width="6" stroke-linecap="round"/>
 <ellipse cx="38" cy="145" rx="11" ry="6" fill="#2F80ED" stroke="#111" stroke-width="3"/>
 <ellipse cx="86" cy="145" rx="11" ry="6" fill="#2F80ED" stroke="#111" stroke-width="3"/>
 <line x1="26" y1="82" x2="10" y2="60" stroke="#111" stroke-width="6" stroke-linecap="round"/>
 <circle cx="9" cy="56" r="8" fill="#F2B84B" stroke="#111" stroke-width="3"/>
 <line x1="98" y1="82" x2="114" y2="100" stroke="#111" stroke-width="6" stroke-linecap="round"/>
 <circle cx="115" cy="103" r="8" fill="#F2B84B" stroke="#111" stroke-width="3"/>
 <rect x="24" y="28" width="76" height="92" rx="16" fill="#F2B84B" stroke="#111" stroke-width="4"/>
 <g stroke="#D4872A" stroke-width="3">
  <line x1="43" y1="33" x2="43" y2="115"/><line x1="62" y1="33" x2="62" y2="115"/><line x1="81" y1="33" x2="81" y2="115"/>
  <line x1="28" y1="51" x2="96" y2="51"/><line x1="28" y1="74" x2="96" y2="74"/><line x1="28" y1="97" x2="96" y2="97"/>
 </g>
 <path d="M28 40 Q30 27 46 28 L82 28 Q96 28 96 40 Q93 48 89 40 Q86 34 82 44 Q79 52 75 42 Q70 36 58 38 Q54 52 50 40 Q44 34 38 42 Q34 50 31 44 Z" fill="#8B4A16" stroke="#111" stroke-width="3" stroke-linejoin="round"/>

let AC=null;
function sfx(kind){
  if(!P.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const notes=kind==='yay'?[523,659,784,1047]:[262,196];
    notes.forEach((f,i)=>{
      const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*0.08;
      o.type=kind==='yay'?'triangle':'sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.18,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.22);
    });
  }catch(e){}
}
function speak(t){
  try{
    if(!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t.replace(/<[^>]+>/g,''));
    u.rate=0.9;u.pitch=1.05;speechSynthesis.speak(u);
  }catch(e){}
}

const OBJ=['🍎','⭐','🐞','🍪','🚀','🐟','🍩','⚽','🦖','🍓'];
function genNA(){
  const rules=[
    {f:x=>x+1,ok:x=>x<=9,say:'adds 1'},{f:x=>x+2,ok:x=>x<=8,say:'adds 2'},{f:x=>x+3,ok:x=>x<=7,say:'adds 3'},
    {f:x=>x-1,ok:x=>x>=2,say:'takes away 1'},{f:x=>x-2,ok:x=>x>=3,say:'takes away 2'},{f:x=>x-3,ok:x=>x>=4,say:'takes away 3'},
    {f:x=>x*2,ok:x=>x<=5,say:'doubles it'},{f:x=>x/2,ok:x=>x%2===0&&x<=10,say:'cuts it in half'}];
  for(let t=0;t<100;t++){
    const r=pick(rules);
    const pool=[];for(let x=1;x<=10;x++) if(r.ok(x)) pool.push(x);
    if(pool.length<3) continue;
    const xs=shuffle(pool).slice(0,3);
    const ans=r.f(xs[2]);
    const others=rules.filter(o=>o!==r&&o.ok(xs[2])).map(o=>o.f(xs[2]));
    const cands=shuffle([...new Set([ans+1,ans-1,xs[2],...others])]).filter(v=>v>=1&&v<=12&&v!==ans);
    if(cands.length<3) continue;
    const e=pick(OBJ);
    const rows=xs.map((x,i)=>`<div class="mrow"><div class="mbox">${grp(x,e)}</div><div class="gear">⚙️➜</div><div class="mbox">${i<2?grp(r.f(x),e):'<span class="qbig">?</span>'}</div></div>`).join('');
    return mk('na',`<div class="machine">${rows}</div>`,grp(ans,e),cands.slice(0,3).map(v=>grp(v,e)),
      `The machine ${r.say}! ${xs[0]} became ${r.f(xs[0])}, and ${xs[1]} became ${r.f(xs[1])}. So ${xs[2]} becomes ${ans}.`,
      {speak:'Look at the number machine. It changes each group the same way. What comes out of the machine at the end?'});
  }
}
function genNP(){
  for(let t=0;t<100;t++){
    if(Math.random()<0.4){ // picture balance version
      const a=1+rnd(6),b=1+rnd(6),T=a+b,c=1+rnd(T-1),ans=T-c;
      if(c===a||c===b) continue;
      const cands=shuffle([...new Set([ans+1,ans-1,ans+2,T,c])]).filter(v=>v>=1&&v<=10&&v!==ans);
      if(cands.length<3) continue;
      const e=pick(OBJ);
      const prompt=`<div class="balance">
        <div class="brow"><span class="blabel">TOP</span><div class="mbox">${grp(a,e)}</div><span class="bplus">+</span><div class="mbox">${grp(b,e)}</div></div>
        <div class="brow"><span class="blabel">BOTTOM</span><div class="mbox">${grp(c,e)}</div><span class="bplus">+</span><div class="mbox"><span class="qbig">?</span></div></div></div>`;
      return mk('np',prompt,grp(ans,e),cands.slice(0,3).map(v=>grp(v,e)),
        `The top row has ${a} + ${b} = ${T}. The bottom row has ${c}, so it needs ${ans} more to make ${T}.`,
        {text:'Both rows need the <u>same number</u>. How many go in the <b>?</b> box?',speak:'Both rows need the same number of things. How many should go in the empty box with the question mark?'});
    }
    let leftT,L;
    if(Math.random()<0.3){const a=5+rnd(6),b=1+rnd(a-2);leftT=[a,'−',b];L=a-b;}
    else{const n=pick([2,3]);const xs=Array.from({length:n},()=>1+rnd(n===2?9:6));leftT=xs.flatMap((x,i)=>i?['+',x]:[x]);L=xs.reduce((s,v)=>s+v,0);}
    if(L<3) continue;
    const m=pick([1,1,2]);const known=[];let s=0;
    for(let i=0;i<m;i++){const mx=Math.min(9,L-1-s);if(mx<1)break;const v=1+rnd(mx);known.push(v);s+=v;}
    if(!known.length) continue;
    const ans=L-s; if(ans<1||ans>12) continue;
    const qFirst=Math.random()<0.3;
    const rightT=qFirst?['?',...known.flatMap(k=>['+',k])]:[...known.flatMap((k,i)=>i?['+',k]:[k]),'+','?'];
    const cands=shuffle([...new Set([ans+1,ans-1,ans+2,L])]).filter(v=>v>=1&&v!==ans);
    if(cands.length<3) continue;

function arrowV(x0,x1,y){ // curved arrow above, left to right
  const mx=(x0+x1)/2;
  return `<path d="M${x0},${y} Q${mx},${y-0.9} ${x1},${y}" fill="none" stroke="#E63946" stroke-width="0.16"/>
  <polygon points="${x1},${y} ${x1-0.47},${y-0.085} ${x1-0.13},${y-0.455}" fill="#E63946"/>`;
}
function arrowH(y0,y1,x){ // curved arrow at left, top to bottom
  const my=(y0+y1)/2;
  return `<path d="M${x},${y0} Q${x-0.9},${my} ${x},${y1}" fill="none" stroke="#E63946" stroke-width="0.16"/>
  <polygon points="${x},${y1} ${x-0.085},${y1-0.47} ${x-0.455},${y1-0.13}" fill="#E63946"/>`;
}
function paper({region=[0,0,4,4],holes=[],shade=false,ghost=false,extra='',tight=false}={},cls='paper'){
  const [x,y,w,h]=region;
  let s=`<svg class="${cls}" viewBox="${tight?'-0.25 -0.25 4.5 4.5':'-1.2 -1.2 6.4 6.4'}" xmlns="http://www.w3.org/2000/svg">`;
  if(ghost) s+=`<rect x="0" y="0" width="4" height="4" fill="none" stroke="#bbb" stroke-width="0.07" stroke-dasharray="0.2 0.15"/>`;
  s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${shade?'#FFD77A':'#FFF6D6'}" stroke="#111" stroke-width="0.14"/>`;
  holes.forEach(([r,c])=>{s+=`<circle cx="${c+0.5}" cy="${r+0.5}" r="0.3" fill="#111"/>`;});
  return s+extra+'</svg>';
}
const hkey=hs=>[...new Set(hs.map(p=>p.join(',')))].sort().join(';');
function genPF(){
  for(let t=0;t<200;t++){
    const fold=pick(['v','h','v','h','vh']);
    const nh=fold==='vh'?1:pick([1,1,2]);
    const rows=fold==='v'?[0,1,2,3]:[2,3], cols=fold==='h'?[0,1,2,3]:[2,3];
    const H=[];let guard=0;
    while(H.length<nh&&guard++<20){const p=[pick(rows),pick(cols)];if(!H.some(q=>q[0]===p[0]&&q[1]===p[1]))H.push(p);}
    const mv=p=>[p[0],3-p[1]],mh=p=>[3-p[0],p[1]],tv=p=>[p[0],p[1]-2],th=p=>[p[0]-2,p[1]];
    let correct,d,steps,why;
    if(fold==='v'){
      correct=[...H,...H.map(mv)];d=[H,[...H,...H.map(tv)],[...H,...H.map(mh)]];
      steps=[['1. FOLD',paper({extra:`<line x1="2" y1="-0.2" x2="2" y2="4.2" stroke="#111" stroke-width="0.1" stroke-dasharray="0.25 0.15"/>${arrowV(0.8,3.2,-0.25)}`})],
             ['2. PUNCH',paper({region:[2,0,2,4],holes:H,shade:true,ghost:true})]];
      why='The fold line is like a mirror. Each hole gets a twin on the other side, the same distance from the fold!';
    }else if(fold==='h'){
      correct=[...H,...H.map(mh)];d=[H,[...H,...H.map(th)],[...H,...H.map(mv)]];
      steps=[['1. FOLD',paper({extra:`<line x1="-0.2" y1="2" x2="4.2" y2="2" stroke="#111" stroke-width="0.1" stroke-dasharray="0.25 0.15"/>${arrowH(0.8,3.2,-0.25)}`})],
             ['2. PUNCH',paper({region:[0,2,4,2],holes:H,shade:true,ghost:true})]];
      why='The paper folded down from the top, so each hole gets a mirror twin above the fold line!';
    }else{
      const mvh=p=>mv(mh(p)),tvh=p=>tv(th(p));
      correct=[...H,...H.map(mv),...H.map(mh),...H.map(mvh)];
      d=[[...H,...H.map(mv)],[...H,...H.map(tv),...H.map(th),...H.map(tvh)],[...H,...H.map(mv),...H.map(mh)]];
      steps=[['1. FOLD',paper({extra:`<line x1="2" y1="-0.2" x2="2" y2="4.2" stroke="#111" stroke-width="0.1" stroke-dasharray="0.25 0.15"/>${arrowV(0.8,3.2,-0.25)}`})],
             ['2. FOLD',paper({region:[2,0,2,4],shade:true,ghost:true,extra:`<line x1="1.8" y1="2" x2="4.2" y2="2" stroke="#111" stroke-width="0.1" stroke-dasharray="0.25 0.15"/>${arrowH(0.8,3.2,1.75)}`})],
             ['3. PUNCH',paper({region:[2,2,2,2],holes:H,shade:true,ghost:true})]];
      why='Two folds make FOUR layers of paper. So one punch makes 4 holes — one in every corner part!';
    }
    const keys=[correct,...d].map(hkey);
    if(new Set(keys).size!==4) continue;
    const prompt=`<div class="pfsteps">${steps.map(([l,s])=>`<div class="pfstep"><span class="pflabel">${l}</span>${s}</div>`).join('')}<div class="pfstep"><span class="pflabel">OPEN = ?</span><svg class="paper" viewBox="0 0 10 10" style="width:100px;height:100px;background:#E3F2FD;border:3px solid #111;border-radius:8px"><text x="5" y="7.3" font-size="6" text-anchor="middle" font-family="Bangers,Impact" fill="#2F80ED">?</text></svg></div></div>`;
    const dedupe=hs=>[...new Set(hs.map(p=>p.join(',')))].map(s=>s.split(',').map(Number));
    return mk('pf',prompt,paper({holes:dedupe(correct),tight:true}),d.map(x=>paper({holes:dedupe(x),tight:true})),why,
      {speak:'The paper was folded, and then holes were punched through it. What will the paper look like when you open it back up?'});
  }
}

  <section class="panel cover">
    <div class="issue">ISSUE #${P.total+1}</div>
    <div class="price">FREE<br>FOR<br>BRAINS</div>
    <h1 class="title">BRAIN<br>BLASTERS!</h1>
    <div class="subtitle">Captain Waffle &amp; Gizmo in: THE PUZZLE PLANET</div>
    <div class="rank">Your rank: <b>${rank()}</b> · Missions: ${P.total}</div>
    <div class="heroes">${WAFFLE}${GIZMO}</div>
  </section>
  <button class="btn big red" style="margin-bottom:18px" onclick="go('map')">🚀 START A MISSION!</button>
  ${checklist()}
  <section class="panel" style="padding:6px">
    <div class="strip">
      <div class="cpanel"><span class="caption">MEANWHILE…</span><div class="say">Uh-oh, Gizmo! The Puzzle Planet is running out of brain power!</div>${WAFFLE}</div>
      <div class="cpanel"><div class="say">BEEP! Only a super-thinker can recharge it… by solving puzzles!</div>${GIZMO}</div>
      <div class="cpanel"><div class="say">Good thing we found YOU, partner! Ready?</div>${WAFFLE}</div>
    </div>
  </section>
  <div class="row">
    <button class="btn blue" style="flex:1" onclick="go('vault')">🏆 Sticker Vault</button>
    <button class="btn" style="flex:1;background:#fff" onclick="go('grown')">🧑 Grown-Ups</button>
  </div>`;
}
function map(){
  app.innerHTML=`
  <div class="panel maphead">${WAFFLE}<div class="bubble left">Pick a world, partner! Each mission is only <b>5 puzzles</b>.</div></div>
  ${WORLDS.map(w=>`<section class="panel world" style="--wc:${w.color}">
    <h2>${w.emoji} ${w.name}</h2><p class="wblurb">${w.blurb}</p>
    <div class="mlist">${w.types.map(t=>{const c=P.missions[t]||0;return `<button class="mbtn ${P.aced[t]?'aced':''}" onclick="startMission('${t}')">
      <span class="micon">${TYPES[t].icon}</span><span class="mname">${TYPES[t].name}</span>
      <span class="mcount">${P.aced[t]?'<span class="acetag">✔ ACED</span>':c?('⭐'.repeat(Math.min(c,5))+(c>5?'+':'')):'<span class="newtag">NEW!</span>'}</span></button>`;}).join('')}</div>
  </section>`).join('')}
  <button class="btn big green" onclick="startMission('mix')">🎲 SURPRISE MISSION!</button>`;
}
function startMission(type){
  const list=type==='mix'?shuffle(Object.keys(TYPES)).slice(0,5):Array(5).fill(type);
  const qs=list.map(t=>TYPES[t].gen()).filter(Boolean);
  M={type,qs,i:0,tries:0,first:0,done:false};
  window.scrollTo(0,0);
  if(type!=='mix'&&!(P.missions[type])) intro(type); else showQ();
}
function intro(t){
  const w=WORLDS.find(w=>w.types.includes(t));
  app.innerHTML=`<section class="panel intro center">
    <div class="qtype">NEW MISSION!</div>
    <h2 style="font-size:40px;margin-top:8px">${TYPES[t].icon} ${TYPES[t].name}</h2>
    <p style="font-size:17px">${w.line}</p>
    <div class="row" style="align-items:center;justify-content:center;flex-wrap:nowrap;text-align:left">
      ${GIZMO}<div class="bubble left"><b>Gizmo’s tip:</b> ${TYPES[t].tip}</div>
    </div>
    <div style="margin-top:16px"><button class="btn big red" onclick="showQ()">LET’S GO! ➜</button></div>
  </section>`;
}
function clearPows(){document.querySelectorAll('.pow').forEach(e=>e.remove());}
function showQ(){
  clearPows();const q=M.qs[M.i];M.tries=0;M.done=false;window.scrollTo(0,0);
  app.innerHTML=`
  <div class="qtop">
    <button class="mini" onclick="go('map')">✖ Exit</button>
    <div class="dots">${M.qs.map((_,j)=>`<span class="dot ${j<M.i?'done':j===M.i?'now':''}"></span>`).join('')}</div>
    <button class="mini" onclick="speakQ()">🔊 Read</button>
  </div>
  <section class="panel">
    <div class="qtype">${TYPES[q.type].icon} ${TYPES[q.type].name}</div>
    <div class="qtext">${q.text}</div>
    <div class="qvis">${q.prompt}</div>
  </section>
  <div class="helper"><div class="av">${GIZMO}</div><div class="bubble left" id="say">${pick(STARTS)}</div><button class="mini" onclick="hint()">💡 Hint</button></div>
  <div class="opts">${q.options.map((o,j)=>`<button class="opt" data-j="${j}" onclick="answer(${j})" aria-label="Answer ${'ABCD'[j]}"><span class="letter">${'ABCD'[j]}</span>${o.html}</button>`).join('')}</div>
  <div class="nextwrap" id="nextwrap"></div>`;
  if(P.autoread) speakQ();
}
function speakQ(){speak(M.qs[M.i].speak);}
function say(h){const el=document.getElementById('say');if(el){el.innerHTML=h;}}
function hint(){const q=M.qs[M.i];say('💡 '+q.hint);if(P.autoread)speak(q.hint);}
function answer(j){
  if(M.done) return;
  const q=M.qs[M.i],btn=document.querySelector(`.opt[data-j="${j}"]`);
  if(q.options[j].correct){
    M.done=true;const first=M.tries===0;if(first)M.first++;
    P.first[q.type]=P.first[q.type]||[0,0];P.first[q.type][0]+=first?1:0;P.first[q.type][1]++;save();
    btn.classList.add('right');pow(btn);sfx('yay');
    document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
    say(`<b>${pick(WINS)}</b> ${q.why}`);
    const last=M.i===M.qs.length-1;
    document.getElementById('nextwrap').innerHTML=`<button class="btn big ${last?'red':'blue'}" onclick="${last?'finish()':'nextQ()'}">${last?'FINISH MISSION! 🏁':'NEXT PUZZLE ➜'}</button>`;
    if(P.autoread) speak(q.why);
    setTimeout(()=>{const n=document.getElementById('nextwrap');if(n&&n.scrollIntoView)n.scrollIntoView({behavior:'smooth',block:'nearest'});},300);
  }else{
    M.tries++;btn.classList.add('wrong');btn.disabled=true;sfx('boop');
    say(M.tries===1?pick(TRY):`${pick(TRY)}<br>💡 ${q.hint}`);
  }
}
function nextQ(){M.i++;showQ();}
function pow(btn){
  const r=btn.getBoundingClientRect(),el=document.createElement('div');
  el.className='pow';el.textContent=pick(POWS);el.style.left=(r.left+r.width/2)+'px';el.style.top=(r.top+r.height/2)+'px';
  document.body.appendChild(el);setTimeout(()=>el.remove(),950);
}
function finish(){
  clearPows();
  P.total++;P.missions[M.type]=(P.missions[M.type]||0)+1;
  const perfect=M.type!=='mix'&&M.first===M.qs.length,newAce=perfect&&!P.aced[M.type];
  if(perfect) P.aced[M.type]=(P.aced[M.type]||0)+1;
  const left=STICKERS.filter(s=>!P.stickers.includes(s));
  const st=left.length?pick(left):pick(STICKERS);
  if(left.length) P.stickers.push(st);
  save();sfx('yay');window.scrollTo(0,0);
  const name=M.type==='mix'?'Surprise':TYPES[M.type].name;
  const bonusT=M.type==='mix'?pick(Object.keys(TYPES)):M.type;
  app.innerHTML=`<section class="panel center">
    <div class="burstbig">MISSION COMPLETE!</div>
    <div class="heroes" style="margin:0">${WAFFLE}${GIZMO}</div>
    <p style="font-size:20px;margin:8px 0">You cracked all ${M.qs.length} ${name} puzzles!</p>
    <p class="zaps">⚡ First-try zaps: ${'⚡'.repeat(M.first)||'— (that’s okay, you kept trying!)'}</p>
    ${perfect?`<div class="acestamp">✔ ACED!</div><p style="margin:4px 0">${newAce?'Checked off on your Mission Checklist!':'Aced it AGAIN!'}</p>`:(M.type!=='mix'?'<p class="note">Get all 5 on the first try to ACE it and check it off your list!</p>':'')}
    <p style="margin:12px 0 0">${left.length?'NEW sticker for your vault!':'Bonus sticker!'}</p>
    <div class="newsticker">${st}</div>
    <p style="font-size:15px">Rank: <b>${rank()}</b></p>
  </section>
  <section class="panel brk"><h3>🧃 BRAIN BREAK!</h3><p>${pick(BREAKS)}</p></section>
  <section class="panel bonus"><b>🧱 Bonus challenge:</b> Invent your own <b>${TYPES[bonusT].name}</b> puzzle for a grown-up — draw it, or build it with LEGO! Can they crack it?</section>
  <div class="stack">
    <button class="btn big red" onclick="startMission('${M.type}')">🔁 ANOTHER ONE!</button>
    <div class="row"><button class="btn blue" style="flex:1" onclick="go('map')">🗺️ Pick a mission</button><button class="btn" style="flex:1;background:#fff" onclick="go('home')">🏠 Home</button></div>
  </div>`;
}
function vault(){
  app.innerHTML=`<section class="panel">
    <h2 style="font-size:34px">🏆 STICKER VAULT</h2>
    <p>You have <b>${P.stickers.length}</b> of ${STICKERS.length} stickers. Finish a mission to win a new one!</p>
    <div class="vault">${STICKERS.map(s=>P.stickers.includes(s)?`<div class="slot">${s}</div>`:'<div class="slot locked">?</div>').join('')}</div>
  </section>
  <button class="btn big red" onclick="go('map')">🚀 WIN MORE STICKERS!</button>`;
}
function grown(){
  const rows=Object.keys(TYPES).map(t=>{const f=P.first[t]||[0,0];const w=WORLDS.find(w=>w.types.includes(t));
    return `<tr><td>${TYPES[t].bat}</td><td>${TYPES[t].real}</td><td>${TYPES[t].icon} ${TYPES[t].name}<br><span class="note">${w.name}</span></td><td>${TYPES[t].learn}</td></tr>`;}).join('');
  const prog=Object.keys(TYPES).map(t=>{const f=P.first[t]||[0,0];
    return `<tr><td>${TYPES[t].real}</td><td>${f[1]}</td><td>${f[1]?Math.round(100*f[0]/f[1])+'%':'—'}</td><td>${P.aced[t]?'✅ '+P.aced[t]+'×':'—'}</td></tr>`;}).join('');
  app.innerHTML=`<section class="panel grown">
    <h2>🧑 GROWN-UP CORNER</h2>
    <p>Brain Blasters gives your child short, playful practice with the <b>9 question types on the CogAT Level 8</b>, the level commonly used in 2nd grade. It’s meant to make the formats familiar — it is <b>not</b> an official practice test and doesn’t predict a score. Check with your district which test and level it uses.</p>
    <h3>What’s inside</h3>
    <table class="tbl"><tr><th>Battery</th><th>CogAT type</th><th>Mission</th><th>Practices</th></tr>${rows}</table>
    <p class="note">Number and shape puzzles are freshly generated every time. Word puzzles rotate through a hand-written set.</p>
    <h3>How to use it</h3>
    <ul>
      <li><b>One mission per sitting.</b> 5 puzzles is about 5–10 minutes. Stop while it’s still fun.</li>
      <li><b>Let him choose the world.</b> Picking the mission keeps him invested.</li>
      <li><b>Turn on Auto-read below.</b> At 2nd grade the CogAT is mostly pictures, with directions read aloud. Confirm this with your school.</li>
      <li><b>No timer, no failing.</b> A wrong answer just grays out and he tries again. A hint appears after the second miss, and every answer comes with a short “why.”</li>
      <li><b>Ask “How’d you crack it?”</b> Explaining his thinking is the real skill. For analogies, teach the sentence trick: “A dog <i>eats</i> a bone… a rabbit <i>eats</i> a ___.”</li>
      <li><b>Use the Bonus Challenge.</b> Inventing a puzzle (with LEGO or a drawing) for you to solve builds the same reasoning, and it suits a builder.</li>
      <li><b>Keep it light.</b> A few short sessions a week for a couple of weeks is plenty. The goal is that nothing looks unfamiliar on test day. Drilling for a high score can place a child where the pace doesn’t fit.</li>
    </ul>
    <h3>Settings</h3>
    <div class="toggle"><span>🔊 Auto-read each question aloud</span><button class="sw ${P.autoread?'on':''}" aria-label="Auto-read" onclick="P.autoread=!P.autoread;save();grown()"></button></div>
    <div class="toggle"><span>🔔 Sound effects</span><button class="sw ${P.sound?'on':''}" aria-label="Sound" onclick="toggleSound();grown()"></button></div>
    <h3>Progress <span class="note">(saved on this device only)</span></h3>
    <p>Missions finished: <b>${P.total}</b> · Stickers: <b>${P.stickers.length}</b></p>
    <table class="tbl"><tr><th>Type</th><th>Puzzles solved</th><th>Right on 1st try</th><th>Aced</th></tr>${prog}</table>
    <p class="note">Use this to see which formats feel new to him, not as a grade. Low first-try numbers usually just mean the format is unfamiliar.</p>
    <div style="margin-top:12px"><button class="btn small" style="background:#fff" onclick="askReset()">Reset all progress</button></div>
  </section>
  <button class="btn big red" onclick="go('home')">⬅ BACK TO THE COMIC</button>`;
}
function askReset(){
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="panel center"><h3 style="font-size:26px">Erase all progress?</h3><p>Stickers, ranks and stats will be wiped on this device.</p>
  <div class="row" style="justify-content:center"><button class="btn small red" id="yesR">Yes, reset</button><button class="btn small" style="background:#fff" id="noR">Cancel</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('#noR').onclick=()=>m.remove();
  m.querySelector('#yesR').onclick=()=>{P.missions={};P.first={};P.stickers=[];P.total=0;P.aced={};save();m.remove();grown();};
}

updSnd();home();
</script>
</body>
</html>
